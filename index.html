<!DOCTYPE html>
<html lang="sr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TRAILCOMMAND – Off-Road Operations & Fleet Maintenance Center</title>
<link rel="manifest" id="manifestLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* =====================================================================
   TRAILCOMMAND – vizuelni identitet (HUD / kokpit)
   ===================================================================== */
:root{
  --bg:#0b0f14; --bg2:#0f151c; --panel:rgba(16,23,31,.72); --panel2:rgba(22,31,42,.85);
  --line:rgba(0,229,255,.16); --line2:rgba(255,255,255,.08);
  --text:#e6edf3; --muted:#8b98a8; --dim:#5c6975;
  --cyan:#00e5ff; --cyan2:rgba(0,229,255,.14); --amber:#ffb020; --amber2:rgba(255,176,32,.14);
  --green:#2ee6a6; --red:#ff4d5e; --yellow:#ffd23f; --blue:#5aa9ff; --purple:#b388ff;
  --glow:0 0 18px rgba(0,229,255,.25);
  --r:12px; --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sidebar:232px; --topbar:56px;
}
[data-theme="light"]{
  --bg:#eef2f6; --bg2:#e4e9ef; --panel:rgba(255,255,255,.78); --panel2:rgba(255,255,255,.95);
  --line:rgba(0,120,140,.22); --line2:rgba(0,0,0,.08);
  --text:#101820; --muted:#51606e; --dim:#8794a1;
  --cyan:#0097a7; --cyan2:rgba(0,151,167,.12); --amber:#c77700; --amber2:rgba(199,119,0,.12);
  --glow:0 0 12px rgba(0,151,167,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden;
  background-image:
    linear-gradient(var(--line2) 1px,transparent 1px),
    linear-gradient(90deg,var(--line2) 1px,transparent 1px),
    radial-gradient(ellipse at 20% 0%,rgba(0,229,255,.08),transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(255,176,32,.06),transparent 50%);
  background-size:40px 40px,40px 40px,100% 100%,100% 100%;}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9000;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  animation:scan 9s linear infinite;mix-blend-mode:overlay}
[data-theme="light"] body::after{opacity:.12}
@keyframes scan{from{background-position:0 0}to{background-position:0 120px}}
.mono{font-family:var(--mono)}
a{color:var(--cyan)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.2px}
h2{font-size:17px}h3{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---- layout ---- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--topbar) 1fr;height:100%;
  padding-top:env(safe-area-inset-top)}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;z-index:50}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:15px}
.logo .mark{width:30px;height:30px;border:1px solid var(--cyan);border-radius:7px;display:grid;place-items:center;box-shadow:var(--glow);color:var(--cyan)}
.logo small{display:block;font-weight:400;letter-spacing:1px;font-size:9px;color:var(--muted)}
.tb-sp{flex:1}
.clock{font-family:var(--mono);font-size:13px;text-align:right;line-height:1.2}
.clock b{font-size:16px;color:var(--cyan);font-weight:500}
.clock span{color:var(--muted);font-size:11px}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.conn.off i{background:var(--red);box-shadow:0 0 8px var(--red)}
.conn.cloud i{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.user{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer}
.user .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center;font-size:11px;font-weight:700;color:#000}
.user .role{color:var(--muted);font-size:10px;text-transform:uppercase}
.ibtn{background:none;border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:.15s}
.ibtn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow)}
.ibtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

#sidebar{border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
#sidebar .sec{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);padding:12px 10px 4px}
.navb{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);cursor:pointer;border:1px solid transparent;font-size:13px;position:relative;background:none;width:100%;text-align:left;font-family:inherit}
.navb:hover{color:var(--text);background:var(--line2)}
.navb.active{color:var(--cyan);background:var(--cyan2);border-color:var(--line)}
.navb.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--cyan);border-radius:2px;box-shadow:var(--glow)}
.navb .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:10px}
.navb .badge.amber{background:var(--amber);color:#000}

#main{overflow:auto;padding:18px 20px 40px;position:relative;scroll-behavior:smooth}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.vhead h1{font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.vhead h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:1.5px;font-family:var(--mono);margin-top:2px}
.vhead .tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04);animation:fade .4s ease both}
.card::before{content:"";position:absolute;top:0;left:12px;right:12px;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.card.amber{border-color:rgba(255,176,32,.35)}
.card.red{border-color:rgba(255,77,94,.4);box-shadow:0 0 20px rgba(255,77,94,.12)}
.card h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;display:flex;gap:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
.stat .val{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--cyan);line-height:1;text-shadow:0 0 14px rgba(0,229,255,.3)}
.stat .val.amber{color:var(--amber);text-shadow:0 0 14px rgba(255,176,32,.3)}
.stat .val.red{color:var(--red);text-shadow:0 0 14px rgba(255,77,94,.3)}
.stat .val.green{color:var(--green)}
.stat .val small{font-size:12px;color:var(--muted);text-shadow:none;margin-left:4px;font-family:var(--sans)}
.stat .sub{font-size:11px;color:var(--muted)}
.corner{position:absolute;width:10px;height:10px;border-color:var(--cyan);border-style:solid;opacity:.6}
.corner.tl{top:-1px;left:-1px;border-width:1px 0 0 1px;border-radius:var(--r) 0 0 0}
.corner.br{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-radius:0 0 var(--r) 0}

/* ---- buttons / forms ---- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--cyan2);color:var(--cyan);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:hover{box-shadow:var(--glow);border-color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#021014;border-color:var(--cyan)}
.btn.amber{background:var(--amber2);color:var(--amber);border-color:rgba(255,176,32,.35)}
.btn.danger{background:rgba(255,77,94,.12);color:var(--red);border-color:rgba(255,77,94,.35)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.xs{padding:3px 7px;font-size:11px;border-radius:6px}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.f{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
[data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{background:rgba(255,255,255,.8)}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:var(--glow)}
input.err{border-color:var(--red)}
input[type=number]{font-family:var(--mono)}
textarea{min-height:64px;resize:vertical}
select option{background:#101820;color:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--cyan)}
.chk.done{color:var(--muted);text-decoration:line-through}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);cursor:pointer;background:none;font-family:inherit}
.chip.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan2)}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;border:1px solid}
.tag.ok{color:var(--green);border-color:rgba(46,230,166,.4)}.tag.warn{color:var(--yellow);border-color:rgba(255,210,63,.4)}.tag.bad{color:var(--red);border-color:rgba(255,77,94,.5);background:rgba(255,77,94,.1)}
.tag.info{color:var(--cyan);border-color:var(--line)}.tag.dim{color:var(--muted);border-color:var(--line2)}

/* ---- tables / lists ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.num,th.num{font-family:var(--mono);text-align:right}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:var(--line2)}
.tscroll{overflow:auto;-webkit-overflow-scrolling:touch}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:600}.li .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mono{font-size:12px}
.empty{text-align:center;color:var(--dim);padding:26px 10px;font-size:13px}
.bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--cyan);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.ok{background:var(--green)}.bar i.warn{background:var(--yellow)}.bar i.bad{background:var(--red)}
.diff{display:inline-flex;gap:2px}.diff i{width:9px;height:9px;border-radius:2px;background:var(--line2)}
.diff i.on{background:var(--amber)}

/* ---- gauges ---- */
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gauge{text-align:center;padding:12px 8px;border:1px solid var(--line2);border-radius:10px;background:rgba(0,0,0,.15);cursor:pointer;transition:.15s}
.gauge:hover{border-color:var(--cyan)}
.gauge svg{width:110px;height:70px;display:block;margin:0 auto}
.gauge .gv{font-family:var(--mono);font-size:18px;margin-top:2px;font-weight:500}
.gauge .gn{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.25;min-height:28px}
.gauge .gs{font-size:10px;font-family:var(--mono);color:var(--dim)}
.gauge.bad{border-color:rgba(255,77,94,.5);box-shadow:0 0 16px rgba(255,77,94,.15);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(255,77,94,.1)}50%{box-shadow:0 0 22px rgba(255,77,94,.35)}}

/* ---- map ---- */
#map{height:calc(100vh - var(--topbar) - 120px);min-height:380px;border-radius:var(--r);border:1px solid var(--line);background:#0e1419;z-index:1}
.maprow{display:grid;grid-template-columns:1fr 330px;gap:14px}
.mapside{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - var(--topbar) - 120px);overflow:auto}
.leaflet-container{font-family:var(--sans);background:#0e1419}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#101820;color:#e6edf3;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;min-width:200px}
.leaflet-popup-content b.t{font-size:14px;display:block;margin-bottom:4px}
.leaflet-bar a{background:#101820;color:#e6edf3;border-color:var(--line)}
.leaflet-bar a:hover{background:#18222e}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#8b98a8!important;font-size:9px}
.leaflet-control-attribution a{color:#8b98a8!important}
.pin{position:relative;width:30px;height:30px}
.pin .b{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #0b0f14;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pin svg{position:absolute;left:7px;top:6px;width:16px;height:16px;stroke:#0b0f14;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pin.me .b{border-radius:50%;transform:none;background:var(--cyan);box-shadow:0 0 0 6px rgba(0,229,255,.25)}
.maptb{position:absolute;top:12px;left:56px;z-index:800;display:flex;gap:6px;flex-wrap:wrap}
.maptb .btn{backdrop-filter:blur(8px);background:rgba(16,23,31,.85)}
.maptb .btn.on{background:var(--cyan);color:#021014}
.photo-grid{display:flex;gap:6px;flex-wrap:wrap}
.photo-grid img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);cursor:pointer}
.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wx .v{font-family:var(--mono);font-size:18px;color:var(--cyan)}
.wx .l{font-size:10px;color:var(--muted);text-transform:uppercase}
.comment{padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px}
.comment b{color:var(--cyan)}.comment small{color:var(--dim);margin-left:6px}

/* ---- modal / drawer ---- */
.modal{position:fixed;inset:0;background:rgba(3,6,10,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel2);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6),var(--glow);animation:fade .25s ease}
.sheet.wide{max-width:900px}
.sheet h2{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet h2 .x{margin-left:auto}
.actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101820;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:9500;pointer-events:none;box-shadow:var(--glow);display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.toast .undo{pointer-events:auto;color:var(--cyan);cursor:pointer;font-weight:600}
.search-res{max-height:50vh;overflow:auto;margin-top:10px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--muted)}
.feed{font-size:12px}
.feed .li small{white-space:normal}
.online{display:flex;gap:6px;flex-wrap:wrap}
.online span{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border:1px solid var(--line2);border-radius:20px}
.online i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.vsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.vsel button{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;font-size:13px}
.vsel button.active{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow)}
.vsel .st{width:8px;height:8px;border-radius:50%}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12px}
.spec div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.spec div span:last-child{font-family:var(--mono);color:var(--cyan);text-align:right}
.sos-big{font-family:var(--mono);font-size:22px;color:var(--amber);text-align:center;padding:14px;border:1px dashed rgba(255,176,32,.5);border-radius:10px;margin:10px 0;word-break:break-all}
.sig{border:1px dashed var(--line);border-radius:8px;background:rgba(0,0,0,.2);touch-action:none;width:100%;height:120px}
canvas.chart{width:100%!important;max-height:260px}
.printonly{display:none}

/* ---- mobile ---- */
#bottomnav{display:none}
@media (max-width:900px){
  :root{--sidebar:0px}
  #app{grid-template-columns:1fr}
  #sidebar{display:none}
  #main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel2);border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(14px)}
  #bottomnav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 7px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;position:relative}
  #bottomnav button.active{color:var(--cyan)}
  #bottomnav button .badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:9px;padding:0 5px;border-radius:8px;font-family:var(--mono)}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .g3 .span2,.g4 .span2{grid-column:span 2}

function readFileAsDataURL(file, maxW = 1200) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image(); img.onload = () => { const s = Math.min(1, maxW / img.width); const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); };
      img.onerror = () => res(r.result); img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function animateCounters(root = document) {
  $$('[data-count]', root).forEach(el => {

<script>

function initMap() {
  if (map || typeof L === 'undefined') { if (!map && $('#map')) $('#map').innerHTML = '<div class="empty">Leaflet nije učitan – potreban je internet pri prvom otvaranju.</div>'; return; }
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([43.9, 20.9], 7);
  baseLayers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri World Imagery' }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap (CC-BY-SA)' }),
  };

  map.on('click', e => {
    if (mode === 'draw') { drawPts.push([e.latlng.lat, e.latlng.lng]); redrawDraft(); }
    else if (mode === 'measure') { measurePts.push([e.latlng.lat, e.latlng.lng]); redrawMeasure(); }
    else openPoiForm(null, e.latlng);
  });
  map.on('dblclick', e => { if (mode === 'draw') { L.DomEvent.stop(e); finishDraw(); } });
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY + '-mapview')); if (v) map.setView([v.lat, v.lng], v.z); } catch (e) { }
  map.on('moveend', () => { try { const c = map.getCenter(); localStorage.setItem(STORE_KEY + '-mapview', JSON.stringify({ lat: c.lat, lng: c.lng, z: map.getZoom() })); } catch (e) { } });

  renderMapSide();
}
function setLayer(k) { if (!map) return; Object.values(baseLayers).forEach(l => map.removeLayer(l)); baseLayers[k].addTo(map); S.settings.mapLayer = k; persist(); $$('.maptb [data-act=layer]').forEach(b => b.classList.toggle('on', b.dataset.v === k)); }

function poiIcon(p) {

}
function filteredPois() {
  const q = ($('#fText')?.value || '').toLowerCase(); const cats = $$('#fCats .chip.on').map(c => c.dataset.v); const diff = +($('#fDiff')?.value || 0); const author = $('#fAuthor')?.value || ''; const rad = +($('#fRad')?.value || 0);
  return S.pois.filter(p => (!q || (p.name + ' ' + p.desc).toLowerCase().includes(q)) && (!cats.length || cats.includes(p.cat)) && p.diff >= diff && (!author || p.author === author) && (!rad || !myPos || haversine(myPos, [p.lat, p.lng]) <= rad));
}
function renderMapSide() {
  const fc = $('#fCats'); if (fc && !fc.children.length) fc.innerHTML = Object.keys(CAT).map(k => `<button class="chip" data-v="${k}" style="border-color:${CAT[k].color}55">${catName(k)}</button>`).join('');

  renderRouteCard();

}
const avgRating = p => p.ratings?.length ? p.ratings.reduce((a, r) => a + r.v, 0) / p.ratings.length : 0;

}

/* ---------- vreme (Open-Meteo, bez ključa) ---------- */
async function loadWeather(id) {
  const p = S.pois.find(x => x.id === id); const box = $('#wxBox') || null;
  const show = html => { if (box) box.innerHTML = html; else openModal(`${modalHead(t('weather') + ' – ' + p.name, 'sun')}${html}`); };
  show('<div class="muted">Učitavam…</div>');
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lng}&current=temperature_2m,precipitation,wind_speed_10m,weather_code&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,wind_speed_10m_max&past_days=2&forecast_days=3&timezone=auto`;
    const r = await fetch(url); if (!r.ok) throw 0; const w = await r.json();
    const past48 = (w.daily.precipitation_sum[0] || 0) + (w.daily.precipitation_sum[1] || 0); const mud = past48 >= 3;
    const days = w.daily.time.map((d, i) => `<tr><td>${fmtD(d)}${i < 2 ? ' <span class="tag dim">prošlo</span>' : i === 2 ? ' <span class="tag info">danas</span>' : ''}</td><td class="num">${U.temp(w.daily.temperature_2m_min[i])} / ${U.temp(w.daily.temperature_2m_max[i])}</td><td class="num">${n1(w.daily.precipitation_sum[i])} mm</td><td class="num">${n0(w.daily.wind_speed_10m_max[i])} km/h</td></tr>`).join('');
    show(`<div class="wx"><div><div class="v">${U.temp(w.current.temperature_2m)}</div><div class="l">Temp.</div></div><div><div class="v">${n1(w.current.precipitation)} mm</div><div class="l">Padavine</div></div><div><div class="v">${n0(w.current.wind_speed_10m)} km/h</div><div class="l">Vetar</div></div></div>
      <div class="tag ${mud ? 'bad' : 'ok'}" style="display:block;text-align:center;margin:10px 0;padding:6px">${mud ? ic('rain') + ' ' + t('mud_risk') + ` (${n1(past48)} mm)` : ic('sun') + ' ' + t('dry')}</div>
      <table><tr><th>Dan</th><th class="num">Min/Max</th><th class="num">Kiša</th><th class="num">Vetar</th></tr>${days}</table><div class="muted" style="font-size:10px;margin-top:4px">Izvor: Open-Meteo</div>`);
  } catch (e) { show('<div class="tag bad">Prognoza nedostupna (offline?)</div>'); }
}

function renderRouteCard() {
  const el = $('#routeCard'); if (!el) return; const r = S.routes.find(x => x.id === activeRouteId);
  el.innerHTML = `<h3>${t('route')} <span class="r">${mode === 'draw' ? `<button class="btn xs primary" data-act="finishDraw">${ic('check')} Završi (${drawPts.length})</button><button class="btn xs ghost" data-act="cancelDraw">${t('cancel')}</button>` : ''}</span></h3>
    <select id="routeSel" style="margin-bottom:8px"><option value="">— izaberi rutu —</option>${S.routes.map(x => `<option value="${x.id}" ${x.id === activeRouteId ? 'selected' : ''}>${esc(x.name)} (${U.dist(pathLength(x.points))})</option>`).join('')}</select>
    ${r ? `<div class="grid g2" style="gap:8px"><div class="stat"><div class="lbl">${t('length')}</div><div class="val" style="font-size:20px">${U.dist(pathLength(r.points))}</div></div><div class="stat"><div class="lbl">${t('duration')}</div><div class="val amber" style="font-size:20px">${estDuration(r)}</div></div></div>
      <div class="chips" style="margin-top:8px"><button class="btn xs" data-act="elevation" data-id="${r.id}">${ic('mountain')} ${t('elevation')}</button><button class="btn xs" data-act="exportRoute" data-id="${r.id}">GPX</button><button class="btn xs" data-act="routeStart" data-id="${r.id}">${ic('nav')} Start</button>${can('delete', r.authorId) ? `<button class="btn xs danger" data-act="delRoute" data-id="${r.id}">${ic('trash')}</button>` : ''}</div><div id="eleBox"></div>` : `<div class="muted" style="font-size:12px">Klikni „${t('draw_route')}" pa klikom na mapu dodaj tačke; dupli klik ili „Završi" za kraj.</div>`}`;
  $('#routeSel').onchange = e => showRoute(e.target.value);
}
function estDuration(r) { const km = pathLength(r.points); const h = km / SPEED.default; const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${hh}h ${String(mm).padStart(2, '0')}m`; }
function showRoute(id) {
  activeRouteId = id || null; routeLayer.clearLayers(); const r = S.routes.find(x => x.id === id);
  if (r) { const pl = L.polyline(r.points, { color: '#00e5ff', weight: 4, opacity: .9, dashArray: '1 0' }).addTo(routeLayer); L.polyline(r.points, { color: '#000', weight: 8, opacity: .35 }).addTo(routeLayer).bringToBack(); L.circleMarker(r.points[0], { radius: 6, color: '#2ee6a6', fillOpacity: 1 }).addTo(routeLayer); L.circleMarker(r.points[r.points.length - 1], { radius: 6, color: '#ff4d5e', fillOpacity: 1 }).addTo(routeLayer); map.fitBounds(pl.getBounds().pad(.15)); }
  renderRouteCard();
}
function startDraw() { if (!requirePerm('add')) return; mode = 'draw'; drawPts = []; $('#drawBtn').classList.add('on'); $('#measureBtn').classList.remove('on'); map.doubleClickZoom.disable(); toast('Klikni na mapu za tačke rute'); renderRouteCard(); }
function redrawDraft() { drawLayer.clearLayers(); if (drawPts.length) L.polyline(drawPts, { color: '#ffb020', weight: 3, dashArray: '6 6' }).addTo(drawLayer); drawPts.forEach(p => L.circleMarker(p, { radius: 4, color: '#ffb020', fillOpacity: 1 }).addTo(drawLayer)); renderRouteCard(); }
function cancelDraw() { mode = null; drawPts = []; drawLayer.clearLayers(); $('#drawBtn').classList.remove('on'); map.doubleClickZoom.enable(); renderRouteCard(); }
function finishDraw() {

function delRoute(id) { confirmBox(t('confirm_delete'), () => { mutate(s => { s.routes = s.routes.filter(r => r.id !== id); s.events.forEach(e => { if (e.routeId === id) e.routeId = ''; }); }, 'obrisao rutu'); activeRouteId = null; routeLayer.clearLayers(); renderRouteCard(); }); }
function startMeasure() { if (mode === 'measure') { mode = null; measurePts = []; measureLayer.clearLayers(); $('#measureBtn').classList.remove('on'); return; } mode = 'measure'; measurePts = []; $('#measureBtn').classList.add('on'); $('#drawBtn').classList.remove('on'); toast('Klikni tačke za merenje; ponovo klikni Merenje za kraj'); }
function redrawMeasure() { measureLayer.clearLayers(); if (measurePts.length > 1) { L.polyline(measurePts, { color: '#ffd23f', weight: 2, dashArray: '4 6' }).addTo(measureLayer); const d = pathLength(measurePts); L.marker(measurePts[measurePts.length - 1], { icon: L.divIcon({ className: '', html: `<div class="tag warn" style="background:#101820;white-space:nowrap">${U.dist(d)}</div>`, iconAnchor: [-6, 10] }) }).addTo(measureLayer); } measurePts.forEach(p => L.circleMarker(p, { radius: 3, color: '#ffd23f', fillOpacity: 1 }).addTo(measureLayer)); }

/* ---------- visinski profil: Open-Elevation, fallback simulacija ---------- */
async function showElevation(id) {
  const r = S.routes.find(x => x.id === id); const box = $('#eleBox'); box.innerHTML = '<div class="muted">Učitavam visine…</div>';
  // uzorkuj rutu na max 80 tačaka ravnomerno po dužini
  const total = pathLength(r.points), N = Math.min(80, Math.max(10, Math.round(total * 4))); const samples = []; let acc = 0, seg = 0;
  for (let i = 0; i < N; i++) { const target = total * i / (N - 1); while (seg < r.points.length - 2 && acc + haversine(r.points[seg], r.points[seg + 1]) < target) { acc += haversine(r.points[seg], r.points[seg + 1]); seg++; } const a = r.points[seg], b = r.points[Math.min(seg + 1, r.points.length - 1)]; const L2 = haversine(a, b) || 1; const f = clamp((target - acc) / L2, 0, 1); samples.push({ lat: a[0] + (b[0] - a[0]) * f, lng: a[1] + (b[1] - a[1]) * f, d: target }); }
  let ele = r.ele && r.ele.length === N ? r.ele : null, src = 'keš';
  if (!ele) {
    try { const res = await fetch('https://api.open-elevation.com/api/v1/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ locations: samples.map(s => ({ latitude: s.lat, longitude: s.lng })) }) }); if (!res.ok) throw 0; const j = await res.json(); ele = j.results.map(x => x.elevation); src = 'Open-Elevation'; r.ele = ele; persist(); }
    catch (e) { let h = 600 + Math.random() * 400; ele = samples.map((s, i) => { h += (Math.sin(i / 5) * 18) + (Math.random() - .5) * 25; return Math.round(h); }); src = 'simulacija (API nedostupan)'; }
  }
  let up = 0, down = 0; for (let i = 1; i < ele.length; i++) { const d = ele[i] - ele[i - 1]; if (d > 0) up += d; else down -= d; }
  box.innerHTML = `<div class="chips" style="margin:8px 0"><span class="tag ok">↑ ${n0(up)} m</span><span class="tag warn">↓ ${n0(down)} m</span><span class="tag dim">min ${n0(Math.min(...ele))} m · max ${n0(Math.max(...ele))} m</span><span class="tag dim">${src}</span></div><canvas class="chart" id="eleChart" height="120"></canvas>`;
  if (typeof Chart === 'undefined') return;
  new Chart($('#eleChart'), { type: 'line', data: { labels: samples.map(s => U.distN(s.d)), datasets: [{ data: ele, borderColor: '#00e5ff', backgroundColor: 'rgba(0,229,255,.15)', fill: true, pointRadius: 0, tension: .3, borderWidth: 2 }] }, options: chartOpts({ x: U.distU(), y: 'm' }) });
}
function chartOpts(axes = {}) {
  const c = getComputedStyle(document.documentElement); const grid = c.getPropertyValue('--line2').trim() || 'rgba(255,255,255,.08)'; const txt = c.getPropertyValue('--muted').trim() || '#8b98a8';
  return { responsive: true, maintainAspectRatio: false, animation: { duration: 700 }, plugins: { legend: { display: axes.legend ?? false, labels: { color: txt, boxWidth: 10 } }, tooltip: { backgroundColor: '#101820', borderColor: '#00e5ff55', borderWidth: 1 } }, scales: { x: { grid: { color: grid }, ticks: { color: txt, maxTicksLimit: 8, font: { family: 'JetBrains Mono', size: 10 } }, title: { display: !!axes.x, text: axes.x, color: txt } }, y: { grid: { color: grid }, ticks: { color: txt, font: { family: 'JetBrains Mono', size: 10 } }, title: { display: !!axes.y, text: axes.y, color: txt }, beginAtZero: axes.zero ?? false } } };
}

/* ---------- GPX / KML ---------- */
function importTrackFile(file) {
  if (!file || !requirePerm('add')) return;
  const rd = new FileReader(); rd.onload = () => {
    try {
      const xml = new DOMParser().parseFromString(rd.result, 'application/xml'); const isKml = /kml/i.test(file.name) || xml.querySelector('kml');
      let tracks = [], wpts = [];
      if (isKml) {
        xml.querySelectorAll('Placemark').forEach(pm => { const name = pm.querySelector('name')?.textContent || file.name; const ls = pm.querySelector('LineString coordinates'); const pt = pm.querySelector('Point coordinates'); if (ls) tracks.push({ name, pts: ls.textContent.trim().split(/\s+/).map(c => c.split(',')).map(c => [+c[1], +c[0]]) }); if (pt) { const c = pt.textContent.trim().split(','); wpts.push({ name, lat: +c[1], lng: +c[0], desc: pm.querySelector('description')?.textContent || '' }); } });
      } else {
        xml.querySelectorAll('trk,rte').forEach(tr => { const name = tr.querySelector('name')?.textContent || file.name; const pts = [...tr.querySelectorAll('trkpt,rtept')].map(p => [+p.getAttribute('lat'), +p.getAttribute('lon')]); if (pts.length > 1) tracks.push({ name, pts, ele: [...tr.querySelectorAll('ele')].map(e => +e.textContent) }); });
        xml.querySelectorAll('wpt').forEach(w => wpts.push({ name: w.querySelector('name')?.textContent || 'Waypoint', lat: +w.getAttribute('lat'), lng: +w.getAttribute('lon'), desc: w.querySelector('desc')?.textContent || '' }));
      }
      if (!tracks.length && !wpts.length) { toast('Nema ruta ni tačaka u fajlu', true); return; }
      let lastId = null;
      mutate(s => {
        tracks.forEach(tr => { const pts = tr.pts.filter((p, i) => i % Math.max(1, Math.floor(tr.pts.length / 1500)) === 0); lastId = uid(); s.routes.push({ id: lastId, name: tr.name, points: pts, author: me().name, authorId: me().id, date: today(), ele: null }); });
        wpts.forEach(w => s.pois.push({ id: uid(), name: w.name, cat: 'enduro', diff: 2, desc: w.desc, lat: w.lat, lng: w.lng, photos: [], author: me().name, authorId: me().id, date: today(), ratings: [], comments: [], history: [{ user: me().name, date: today(), action: 'uvezeno iz ' + file.name }] }));
      }, `uvezao ${tracks.length} ruta i ${wpts.length} tačaka iz ${file.name}`);
      if (lastId) showRoute(lastId);
    } catch (e) { toast('Greška pri čitanju fajla', true); }
  }; rd.readAsText(file); $('#gpxFile').value = '';
}
function gpxString(routes, pois) {
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="TRAILCOMMAND" xmlns="http://www.topografix.com/GPX/1/1">\n` +
    pois.map(p => `  <wpt lat="${p.lat}" lon="${p.lng}"><name>${esc(p.name)}</name><desc>${esc(p.desc)}</desc><type>${p.cat}</type></wpt>`).join('\n') + '\n' +
    routes.map(r => `  <trk><name>${esc(r.name)}</name><trkseg>\n${r.points.map((p, i) => `    <trkpt lat="${p[0]}" lon="${p[1]}">${r.ele && r.ele[i] != null ? `<ele>${r.ele[i]}</ele>` : ''}</trkpt>`).join('\n')}\n  </trkseg></trk>`).join('\n') + '\n</gpx>';
}
function kmlString(routes, pois) {
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>TRAILCOMMAND</name>\n` +
    pois.map(p => `<Placemark><name>${esc(p.name)}</name><description>${esc(p.desc)}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('\n') + '\n' +
    routes.map(r => `<Placemark><name>${esc(r.name)}</name><LineString><tessellate>1</tessellate><coordinates>${r.points.map(p => `${p[1]},${p[0]},0`).join(' ')}</coordinates></LineString></Placemark>`).join('\n') + '\n</Document></kml>';
}

/* ---------- heatmap ---------- */
function buildHeat() {
  if (typeof L.heatLayer !== 'function') { toast('Heat sloj nije učitan', true); return; }
  const pts = []; S.pois.forEach(p => pts.push([p.lat, p.lng, .35])); S.trips.forEach(tr => { const p = S.pois.find(x => x.id === tr.poiId); if (p) pts.push([p.lat, p.lng, clamp(tr.hours / 3, .4, 1.2)]); });
  if (heatLayer) map.removeLayer(heatLayer); heatLayer = L.heatLayer(pts, { radius: 35, blur: 25, maxZoom: 11, gradient: { .3: '#0033ff', .6: '#00e5ff', .8: '#ffb020', 1: '#ff4d5e' } }).addTo(map);
}
function toggleHeat() { if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; $('#heatBtn').classList.remove('on'); } else { buildHeat(); $('#heatBtn').classList.add('on'); } }

/* ---------- geolokacija ---------- */
function locate(cb) {
  if (!navigator.geolocation) { toast('GPS nije dostupan', true); return; }
  toast('Tražim lokaciju…');
  navigator.geolocation.getCurrentPosition(pos => {
    myPos = [pos.coords.latitude, pos.coords.longitude];
    if (map) { if (myMarker) map.removeLayer(myMarker); myMarker = L.marker(myPos, { icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="pin me" style="width:18px;height:18px"><div class="b"></div></div>' }) }).addTo(map).bindPopup(`Ti si ovde<br><button class="btn xs" data-act="poiHere">${ic('plus')} Tačka ovde</button>`); map.setView(myPos, Math.max(map.getZoom(), 13)); renderMapSide(); }
    cb && cb(myPos);
  }, () => toast('Lokacija odbijena ili nedostupna', true), { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}
</script>
<script>
/* ================================================================== */
/*  FLEET MODUL – vozila, intervali, merači, servisna knjižica,       */
/*  vožnje, gorivo, delovi, troškovi, specifikacije                   */
/* ================================================================== */
let fleetVid = null; const curVeh = () => S.vehicles.find(v => v.id === fleetVid) || S.vehicles[0];

/* status jedne stavke održavanja: istrošenost (0..1+) i preostalo */
function svcStatus(v, s) {
  const parts = [];
  if (s.intH) parts.push({ pct: (v.hours - (s.lastH || 0)) / s.intH, rem: (s.lastH || 0) + s.intH - v.hours, unit: 'h' });
  if (s.intKm) parts.push({ pct: (v.km - (s.lastKm || 0)) / s.intKm, rem: (s.lastKm || 0) + s.intKm - v.km, unit: 'km' });
  if (s.intM && s.lastDate) { const d = daysBetween(s.lastDate, today()); parts.push({ pct: d / (s.intM * 30.4), rem: Math.round(s.intM * 30.4 - d), unit: t('days') }); }
  if (!parts.length) return { pct: 0, rem: Infinity, unit: '', level: 'ok', text: '—' };
  const w = parts.reduce((a, b) => b.pct > a.pct ? b : a);
  const level = w.pct >= 1 ? 'bad' : w.pct >= .8 ? 'warn' : 'ok';
  const ar = Math.abs(w.rem); const text = w.unit === 'h' ? n1(ar) + ' h' : w.unit === 'km' ? n0(ar) + ' km' : n0(ar) + ' ' + t('days');
  return { pct: w.pct, rem: w.rem, unit: w.unit, level, text, all: parts };
}
function fleetAlerts() { let bad = 0, warn = 0; S.vehicles.forEach(v => v.services.forEach(s => { const l = svcStatus(v, s).level; if (l === 'bad') bad++; else if (l === 'warn') warn++; })); return { bad, warn }; }
const lowParts = () => S.parts.filter(p => p.qty <= p.min);
const lastServiceOf = v => S.services.filter(s => s.vehicleId === v.id).sort((a, b) => b.date.localeCompare(a.date))[0];
function nextSvc(v) { return v.services.map(s => ({ s, st: svcStatus(v, s) })).sort((a, b) => b.st.pct - a.st.pct)[0]; }
function expiryTag(d, label) { if (!d) return ''; const n = daysBetween(today(), d); return `<span class="tag ${n < 0 ? 'bad' : n < 30 ? 'warn' : 'ok'}">${label}: ${n < 0 ? t('expired') : fmtD(d) + ' (' + n + ' ' + t('days') + ')'}</span>`; }

/* SVG polukružni merač */
function gaugeSvg(pct, level) {
  const p = clamp(pct, 0, 1); const r = 42, cx = 55, cy = 55; const a = Math.PI * (1 - p); const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  const col = level === 'bad' ? 'var(--red)' : level === 'warn' ? 'var(--yellow)' : 'var(--green)';
  const arc = (from, to, color, w = 7) => { const a1 = Math.PI * (1 - from), a2 = Math.PI * (1 - to); return `<path d="M${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)} A${r} ${r} 0 ${to - from > .5 ? 1 : 0} 1 ${cx + r * Math.cos(a2)} ${cy - r * Math.sin(a2)}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="butt"/>`; };
  return `<svg viewBox="0 0 110 62">${arc(0, .8, 'rgba(46,230,166,.18)')}${arc(.8, 1, 'rgba(255,210,63,.18)')}${arc(.98, 1, 'rgba(255,77,94,.4)')}
    ${p > 0 ? arc(0, p, col) : ''}<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--text)"/></svg>`;
}
function vehSelector() { return `<div class="vsel">${S.vehicles.map(v => { const n = nextSvc(v); return `<button class="${curVeh()?.id === v.id ? 'active' : ''}" data-act="selVeh" data-id="${v.id}">${ic(v.type === 'utv' ? 'buggy' : 'moto')}${esc(v.name)}<span class="st" style="background:var(--${n?.st.level === 'bad' ? 'red' : n?.st.level === 'warn' ? 'yellow' : 'green'})"></span></button>`; }).join('')}<button data-act="vehForm">${ic('plus')} ${t('vehicle')}</button></div>`; }

/* ---------- DASHBOARD ---------- */
function renderDashboard() {
  const al = fleetAlerts(); const totH = S.vehicles.reduce((a, v) => a + v.hours, 0), totKm = S.vehicles.reduce((a, v) => a + v.km, 0);
  const upcoming = S.events.filter(e => e.date >= today()).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
  const warnings = [];
  S.vehicles.forEach(v => { v.services.forEach(s => { const st = svcStatus(v, s); if (st.level !== 'ok') warnings.push({ v, s, st }); }); ['regExpiry', 'insExpiry'].forEach(k => { if (v[k] && daysBetween(today(), v[k]) < 30) warnings.push({ v, s: { name: (k === 'regExpiry' ? t('registration') : t('insurance')) + ' ' + t('expires') + ' ' + fmtD(v[k]) }, st: { level: daysBetween(today(), v[k]) < 0 ? 'bad' : 'warn', text: daysBetween(today(), v[k]) + ' ' + t('days'), pct: 1 } }); }); });
  warnings.sort((a, b) => b.st.pct - a.st.pct);
  const month = monthKey(today()); const mHours = S.trips.filter(x => monthKey(x.date) === month).reduce((a, x) => a + x.hours, 0);
  $('#v-dashboard').innerHTML = `<div class="vhead"><h1>${t('nav_dashboard')}<small>SYSTEM STATUS · ${S.vehicles.length} VEHICLES · ${S.pois.length} POI</small></h1><div class="tools"><button class="btn sm" data-act="tripForm">${ic('trips')} ${t('add_trip')}</button><button class="btn sm" data-act="svcForm">${ic('service')} ${t('add_service')}</button><button class="btn sm" data-act="go" data-v="map">${ic('map')} ${t('nav_map')}</button></div></div>
    <div class="grid g4">
      <div class="card stat"><span class="corner tl"></span><span class="corner br"></span><div class="lbl">${t('total_hours')}</div><div class="val" data-count="${totH}" data-dec="1">0</div><div class="sub">${t('all_vehicles')}</div></div>
      <div class="card stat"><div class="lbl">${t('total_km')}</div><div class="val" data-count="${U.distN(totKm)}" data-dec="0">0</div><div class="sub">${U.distU()}</div></div>
      <div class="card stat ${al.bad ? 'red' : al.warn ? 'amber' : ''}"><div class="lbl">${t('overdue_items')}</div><div class="val ${al.bad ? 'red' : al.warn ? 'amber' : 'green'}" data-count="${al.bad}">0</div><div class="sub">${al.warn} ${t('soon').toLowerCase()}</div></div>
      <div class="card stat"><div class="lbl">Sati ovog meseca</div><div class="val amber" data-count="${mHours}" data-dec="1">0</div><div class="sub">${S.trips.filter(x => monthKey(x.date) === month).length} vožnji</div></div>
    </div>
    <div class="grid g3" style="margin-top:14px">
      <div class="card span2"><h3>${ic('warn')} ${t('warnings')} <span class="r"><span class="tag bad">${al.bad} ${t('urgent')}</span><span class="tag warn">${al.warn} ${t('soon')}</span></span></h3>
        ${warnings.length ? warnings.slice(0, 8).map(w => `<div class="li" style="cursor:pointer" data-act="goFleet" data-id="${w.v.id}"><span class="tag ${w.st.level}">${w.st.level === 'bad' ? t('urgent') : t('soon')}</span><div class="t"><b>${esc(w.s.name)}</b><small>${esc(w.v.name)}</small></div><span class="mono" style="color:var(--${w.st.level === 'bad' ? 'red' : 'yellow'})">${w.st.rem < 0 ? 'KASNI ' : ''}${esc(w.st.text)}</span></div>`).join('') : `<div class="empty">${ic('check')} Sve je u zelenoj zoni.</div>`}</div>
      <div class="card"><h3>${ic('planner')} ${t('nav_planner')}</h3>${upcoming.length ? upcoming.map(e => `<div class="li" data-act="goView" data-id="planner" style="cursor:pointer"><div class="t"><b>${esc(e.title)}</b><small>${fmtD(e.date)} · ${e.participants.length} učesnika</small></div><span class="mono" style="color:var(--cyan)">${daysBetween(today(), e.date)}d</span></div>`).join('') : '<div class="empty">Nema planiranih izlazaka</div>'}</div>
    </div>
    <div class="grid g2" style="margin-top:14px">${S.vehicles.map(v => { const n = nextSvc(v); const ls = lastServiceOf(v); return `<div class="card" style="cursor:pointer" data-act="goFleet" data-id="${v.id}"><h3>${ic(v.type === 'utv' ? 'buggy' : 'moto')} ${esc(v.name)} <span class="r">${expiryTag(v.regExpiry, 'REG')}</span></h3>
        <div class="grid g3" style="gap:8px"><div class="stat"><div class="lbl">${t('hours')}</div><div class="val" style="font-size:22px">${n1(v.hours)}</div></div><div class="stat"><div class="lbl">${U.distU()}</div><div class="val" style="font-size:22px">${n0(U.distN(v.km))}</div></div><div class="stat"><div class="lbl">${t('since_service')}</div><div class="val amber" style="font-size:22px">${ls ? n1(v.hours - ls.hours) : '—'}</div></div></div>
        ${n ? `<div style="margin-top:10px;font-size:12px" class="muted">${t('next_service')}: <b style="color:var(--text)">${esc(n.s.name)}</b> · <span class="mono" style="color:var(--${n.st.level === 'bad' ? 'red' : n.st.level === 'warn' ? 'yellow' : 'green'})">${n.st.rem < 0 ? 'KASNI ' : ''}${n.st.text}</span></div><div class="bar" style="margin-top:6px"><i class="${n.st.level}" style="width:${clamp(n.st.pct * 100, 0, 100)}%"></i></div>` : ''}</div>`; }).join('')}</div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>${ic('team')} ${t('activity')}</h3><div class="feed">${S.activity.slice(0, 6).map(a => `<div class="li"><div class="av" style="width:24px;height:24px;border-radius:50%;background:var(--cyan2);color:var(--cyan);display:grid;place-items:center;font-size:11px;font-weight:700">${esc(a.user.slice(0, 1))}</div><div class="t"><small style="color:var(--text)"><b>${esc(a.user)}</b> ${esc(a.text)}</small><small>${new Date(a.date).toLocaleString('sr-Latn')}</small></div></div>`).join('')}</div></div>
      <div class="card"><h3>${ic('parts')} ${t('nav_parts')} – manjak</h3>${lowParts().length ? lowParts().map(p => `<div class="li"><span class="tag warn">${p.qty}/${p.min}</span><div class="t"><b>${esc(p.name)}</b><small>${esc(p.partNo)} · ${vname(p.vehicleId)}</small></div></div>`).join('') : '<div class="empty">Inventar OK</div>'}</div></div>`;
  animateCounters($('#v-dashboard'));
}

/* ---------- FLOTA ---------- */
function renderFleet() {
  const v = curVeh(); if (!v) { $('#v-fleet').innerHTML = `<div class="vhead"><h1>${t('nav_fleet')}</h1></div>${vehSelector()}<div class="empty">Dodaj prvo vozilo.</div>`; return; }
  const ls = lastServiceOf(v); const n = nextSvc(v); const items = v.services.map(s => ({ s, st: svcStatus(v, s) })).sort((a, b) => b.st.pct - a.st.pct); const urgent = items.filter(i => i.st.level === 'bad');
  const fuelL = S.fuel.filter(f => f.vehicleId === v.id); const trips = S.trips.filter(x => x.vehicleId === v.id);
  $('#v-fleet').innerHTML = `<div class="vhead"><h1>${esc(v.name)}<small>${esc(v.brand || '')} ${esc(v.model || '')} · ${v.year || ''} · VIN ${esc(v.vin || '—')}</small></h1>
      <div class="tools"><button class="btn sm" data-act="tripForm" data-id="${v.id}">${ic('trips')} ${t('add_trip')}</button><button class="btn sm primary" data-act="svcForm" data-id="${v.id}">${ic('service')} ${t('add_service')}</button><button class="btn sm" data-act="vehForm" data-id="${v.id}">${ic('edit')}</button></div></div>
    ${vehSelector()}
    <div class="grid g4">
      <div class="card stat"><span class="corner tl"></span><span class="corner br"></span><div class="lbl">${t('total_hours')}</div><div class="val" data-count="${v.hours}" data-dec="1">0</div><div class="sub">${trips.length} vožnji upisano</div></div>
      <div class="card stat"><div class="lbl">${t('total_km')}</div><div class="val" data-count="${U.distN(v.km)}">0</div><div class="sub">${U.distU()}</div></div>
      <div class="card stat"><div class="lbl">${t('since_service')}</div><div class="val amber" data-count="${ls ? v.hours - ls.hours : 0}" data-dec="1">0</div><div class="sub">${ls ? fmtD(ls.date) + ' · ' + esc(ls.desc).slice(0, 30) : '—'}</div></div>
      <div class="card stat ${n?.st.level === 'bad' ? 'red' : n?.st.level === 'warn' ? 'amber' : ''}"><div class="lbl">${t('next_service')}</div><div class="val ${n?.st.level === 'bad' ? 'red' : n?.st.level === 'warn' ? 'amber' : 'green'}" style="font-size:22px">${n ? (n.st.rem < 0 ? 'KASNI ' : '') + esc(n.st.text) : '—'}</div><div class="sub">${n ? esc(n.s.name) : ''}</div></div>
    </div>
    ${urgent.length ? `<div class="card red" style="margin-top:14px"><h3 style="color:var(--red)">${ic('warn')} ${t('urgent')} – ${t('overdue_items')} (${urgent.length})</h3>${urgent.map(i => `<div class="li"><span class="tag bad">${n0(clamp(i.st.pct, 0, 9) * 100)}%</span><div class="t"><b>${esc(i.s.name)}</b><small>${esc(i.s.note)}</small></div><button class="btn xs" data-act="svcForm" data-id="${v.id}" data-item="${i.s.id}">${ic('check')} Urađeno</button></div>`).join('')}</div>` : ''}
    <div class="card" style="margin-top:14px"><h3>${ic('gauge')} Instrument tabla – ${t('wear')} po stavci <span class="r"><button class="btn xs" data-act="svcItemForm" data-id="${v.id}">${ic('plus')} Interval</button></span></h3>
      <div class="gauges">${items.map(i => `<div class="gauge ${i.st.level}" data-act="svcItemForm" data-id="${v.id}" data-item="${i.s.id}">${gaugeSvg(i.st.pct, i.st.level)}<div class="gv" style="color:var(--${i.st.level === 'bad' ? 'red' : i.st.level === 'warn' ? 'yellow' : 'green'})">${n0(clamp(i.st.pct, 0, 9.99) * 100)}%</div><div class="gn">${esc(i.s.name)}</div><div class="gs">${i.st.rem < 0 ? 'KASNI ' : 'još '}${esc(i.st.text)}${i.st.all?.length > 1 ? ' · ' + i.st.all.filter(a => a !== i.st.all.reduce((x, y) => y.pct > x.pct ? y : x)).map(a => (a.rem < 0 ? '−' : '') + (a.unit === 'h' ? n1(Math.abs(a.rem)) : n0(Math.abs(a.rem))) + ' ' + a.unit).join(' · ') : ''}</div></div>`).join('')}</div></div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>${ic('fleet')} ${t('specs')}</h3><div class="spec">${(v.specs || []).map(s => `<div><span>${esc(s[0])}</span><span>${esc(s[1])}</span></div>`).join('')}</div><div class="muted" style="font-size:11px;margin-top:8px">${ic('warn')} ${t('verify_manual')}</div></div>
      <div class="card"><h3>${ic('checklist')} Dokumenti i podaci</h3>
        <div class="spec" style="grid-template-columns:1fr"><div><span>VIN</span><span>${esc(v.vin || '—')}</span></div><div><span>${t('registration')}</span><span>${esc(v.reg || '—')}</span></div><div><span>${t('registration')} ${t('expires')}</span><span>${fmtD(v.regExpiry)}</span></div><div><span>${t('insurance')} ${t('expires')}</span><span>${fmtD(v.insExpiry)}</span></div></div>
        <div class="chips" style="margin-top:10px">${expiryTag(v.regExpiry, t('registration'))}${expiryTag(v.insExpiry, t('insurance'))}</div>
        <h3 style="margin-top:14px">${ic('fuel')} ${t('nav_fuel')}</h3><div class="grid g2" style="gap:8px"><div class="stat"><div class="lbl">Prosek L/100km</div><div class="val" style="font-size:20px">${fuelAvg(v).per100 ? n1(fuelAvg(v).per100) : '—'}</div></div><div class="stat"><div class="lbl">Prosek L/h</div><div class="val" style="font-size:20px">${fuelAvg(v).perH ? n1(fuelAvg(v).perH) : '—'}</div></div></div>
        ${v.notes ? `<p class="muted" style="font-size:12px;margin-top:10px">${esc(v.notes)}</p>` : ''}</div>
    </div>`;
  animateCounters($('#v-fleet'));
}
function fuelAvg(v) { const f = S.fuel.filter(x => x.vehicleId === v.id).sort((a, b) => a.date.localeCompare(b.date)); if (f.length < 2) return {}; const L = f.slice(1).reduce((a, x) => a + x.liters, 0); const km = f[f.length - 1].km - f[0].km, h = f[f.length - 1].hours - f[0].hours; return { per100: km > 0 ? L / km * 100 : 0, perH: h > 0 ? L / h : 0 }; }

function vehForm(id) {
  const v = id ? S.vehicles.find(x => x.id === id) : { name: '', type: 'enduro', brand: '', model: '', year: new Date().getFullYear(), hours: 0, km: 0, vin: '', reg: '', regExpiry: '', insExpiry: '', notes: '', specs: [] };
  if (!requirePerm(id ? 'edit' : 'add')) return;
  openModal(`${modalHead(id ? v.name : 'Novo vozilo', 'fleet')}
    <div class="f2"><div><label class="f">${t('name')} *</label><input id="v-name" value="${esc(v.name)}"></div><div><label class="f">Tip</label><select id="v-type"><option value="enduro" ${v.type === 'enduro' ? 'selected' : ''}>Enduro motor</option><option value="utv" ${v.type === 'utv' ? 'selected' : ''}>UTV / buggy</option><option value="other" ${v.type === 'other' ? 'selected' : ''}>Ostalo</option></select></div></div>
    <div class="f3"><div><label class="f">Marka</label><input id="v-brand" value="${esc(v.brand)}"></div><div><label class="f">Model</label><input id="v-model" value="${esc(v.model)}"></div><div><label class="f">Godište</label><input id="v-year" type="number" value="${v.year}"></div></div>
    <div class="f2"><div><label class="f">Radni sati</label><input id="v-hours" type="number" step="0.1" value="${v.hours}"></div><div><label class="f">Km</label><input id="v-km" type="number" value="${v.km}"></div></div>
    <div class="f2"><div><label class="f">VIN / šasija</label><input id="v-vin" value="${esc(v.vin)}"></div><div><label class="f">${t('registration')}</label><input id="v-reg" value="${esc(v.reg)}"></div></div>
    <div class="f2"><div><label class="f">${t('registration')} ${t('expires')}</label><input id="v-regx" type="date" value="${v.regExpiry || ''}"></div><div><label class="f">${t('insurance')} ${t('expires')}</label><input id="v-insx" type="date" value="${v.insExpiry || ''}"></div></div>
    <label class="f">${t('specs')} (jedna po liniji: Naziv | Vrednost)</label><textarea id="v-specs" style="min-height:90px;font-family:var(--mono);font-size:12px">${(v.specs || []).map(s => s[0] + ' | ' + s[1]).join('\n')}</textarea>
    <label class="f">${t('notes')}</label><textarea id="v-notes">${esc(v.notes)}</textarea>
    ${!id ? `<label class="f">Šablon intervala</label><select id="v-tpl"><option value="">Prazno (dodaj ručno)</option><option value="sherco">Enduro 4T (Sherco šablon)</option><option value="polaris">UTV (Polaris šablon)</option></select>` : ''}
    <div class="actions">${id ? `<button class="btn danger" data-act="delVeh" data-id="${id}">${ic('trash')} ${t('delete')}</button>` : ''}<button class="btn ghost" data-act="closeModal">${t('cancel')}</button><button class="btn primary" id="v-save">${ic('check')} ${t('save')}</button></div>`);
  $('#v-save').onclick = () => {
    if (!validate(['v-name'])) return;
    const data = { name: formVal('v-name').trim(), type: formVal('v-type'), brand: formVal('v-brand'), model: formVal('v-model'), year: num('v-year'), hours: num('v-hours'), km: num('v-km'), vin: formVal('v-vin'), reg: formVal('v-reg'), regExpiry: formVal('v-regx'), insExpiry: formVal('v-insx'), notes: formVal('v-notes'), specs: formVal('v-specs').split('\n').map(l => l.split('|').map(x => x.trim())).filter(l => l[0] && l[1]) };
    mutate(s => { if (id) Object.assign(s.vehicles.find(x => x.id === id), data); else { const tpl = formVal('v-tpl'); const nv = { id: uid(), services: tpl === 'sherco' ? shercoServices() : tpl === 'polaris' ? polarisServices() : [], ...data }; nv.services.forEach(x => { x.lastH = nv.hours; x.lastKm = nv.km; x.lastDate = today(); }); s.vehicles.push(nv); fleetVid = nv.id; } }, (id ? 'izmenio vozilo ' : 'dodao vozilo ') + data.name);
    closeModal();

/* ---------- DELOVI ---------- */
function renderParts() {

    <div class="card"><div class="tscroll"><table><tr><th>Deo</th><th>Kat. broj</th><th>${t('vehicle')}</th><th class="num">Kol.</th><th class="num">Min</th><th class="num">Cena</th><th>Status</th><th></th></tr>
    ${list.map(p => `<tr><td><b>${esc(p.name)}</b></td><td class="mono">${esc(p.partNo)}</td><td>${esc(vname(p.vehicleId))}</td><td class="num">${p.qty}</td><td class="num">${p.min}</td><td class="num">${money(p.price)}</td><td>${p.qty <= p.min ? `<span class="tag ${p.qty === 0 ? 'bad' : 'warn'}">${p.qty === 0 ? 'NEMA' : 'MANJAK'}</span>` : '<span class="tag ok">OK</span>'}</td><td style="white-space:nowrap"><button class="btn xs" data-act="partQty" data-id="${p.id}" data-d="-1">−</button> <button class="btn xs" data-act="partQty" data-id="${p.id}" data-d="1">+</button> <button class="btn xs ghost" data-act="partForm" data-id="${p.id}">${ic('edit')}</button></td></tr>`).join('') || `<tr><td colspan="8" class="empty">Prazan inventar</td></tr>`}</table></div></div>`;
}
function partForm(id) {

  openModal(`${modalHead(id ? p.name : 'Novi deo', 'parts')}<label class="f">${t('name')} *</label><input id="pt-name" value="${esc(p.name)}"><div class="f2"><div><label class="f">Kataloški broj</label><input id="pt-no" value="${esc(p.partNo)}"></div><div><label class="f">${t('vehicle')}</label><select id="pt-vid">${S.vehicles.map(x => `<option value="${x.id}" ${x.id === p.vehicleId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div>

/* ---------- TROŠKOVI ---------- */
function costRows() { const rows = []; S.services.forEach(s => rows.push({ date: s.date, vehicleId: s.vehicleId, cat: 'Servis', amt: s.cost || 0 })); S.fuel.forEach(f => rows.push({ date: f.date, vehicleId: f.vehicleId, cat: 'Gorivo', amt: f.cost || 0 })); return rows; }
function renderCosts() {
  const rows = costRows(); const months = [...new Set(rows.map(r => monthKey(r.date)))].sort().slice(-12); const total = rows.reduce((a, r) => a + r.amt, 0);
  $('#v-costs').innerHTML = `<div class="vhead"><h1>${t('nav_costs')}<small>TOTAL ${money(total)} · ${months.length} MONTHS</small></h1><div class="tools"><button class="btn sm" data-act="csvCosts">${t('export_csv')}</button></div></div>
    <div class="grid g3">${S.vehicles.map(v => { const r = rows.filter(x => x.vehicleId === v.id); const sv = r.filter(x => x.cat === 'Servis').reduce((a, x) => a + x.amt, 0), fu = r.filter(x => x.cat === 'Gorivo').reduce((a, x) => a + x.amt, 0); return `<div class="card stat"><div class="lbl">${esc(v.name)}</div><div class="val" style="font-size:24px" data-count="${sv + fu}">0</div><div class="sub">Servis ${money(sv)} · Gorivo ${money(fu)} · ${v.hours ? money((sv + fu) / v.hours) + '/h' : ''}</div></div>`; }).join('')}</div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>${t('per_month')}</h3><div style="height:260px"><canvas class="chart" id="costMonth"></canvas></div></div><div class="card"><h3>${t('per_vehicle')}</h3><div style="height:260px"><canvas class="chart" id="costVeh"></canvas></div></div></div>
    <div class="card" style="margin-top:14px"><div class="tscroll"><table><tr><th>Mesec</th>${S.vehicles.map(v => `<th class="num">${esc(v.name)}</th>`).join('')}<th class="num">${t('total')}</th></tr>${months.slice().reverse().map(m => `<tr><td class="mono">${m}</td>${S.vehicles.map(v => `<td class="num">${money(rows.filter(r => monthKey(r.date) === m && r.vehicleId === v.id).reduce((a, r) => a + r.amt, 0))}</td>`).join('')}<td class="num"><b>${money(rows.filter(r => monthKey(r.date) === m).reduce((a, r) => a + r.amt, 0))}</b></td></tr>`).join('')}</table></div></div>`;
  animateCounters($('#v-costs'));
  if (typeof Chart === 'undefined') return;
  const colors = ['#00e5ff', '#ffb020', '#b388ff', '#2ee6a6'];
  new Chart($('#costMonth'), { type: 'bar', data: { labels: months, datasets: S.vehicles.map((v, i) => ({ label: v.name, data: months.map(m => rows.filter(r => monthKey(r.date) === m && r.vehicleId === v.id).reduce((a, r) => a + r.amt, 0)), backgroundColor: colors[i % 4] + 'cc', borderRadius: 4 })) }, options: { ...chartOpts({ legend: true, zero: true }), scales: { x: { stacked: true, ticks: { color: '#8b98a8' } }, y: { stacked: true, ticks: { color: '#8b98a8' } } } } });
  new Chart($('#costVeh'), { type: 'doughnut', data: { labels: S.vehicles.flatMap(v => [v.name + ' – servis', v.name + ' – gorivo']), datasets: [{ data: S.vehicles.flatMap(v => ['Servis', 'Gorivo'].map(c => rows.filter(r => r.vehicleId === v.id && r.cat === c).reduce((a, r) => a + r.amt, 0))), backgroundColor: ['#00e5ff', '#00e5ff77', '#ffb020', '#ffb02077', '#b388ff', '#b388ff77'], borderColor: '#0b0f14' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8b98a8', boxWidth: 10, font: { size: 10 } } } } } });
}
function csvCosts() { download('troskovi.csv', '﻿' + csv([['Datum', 'Vozilo', 'Kategorija', 'Iznos'], ...costRows().sort((a, b) => a.date.localeCompare(b.date)).map(r => [r.date, vname(r.vehicleId), r.cat, r.amt])]), 'text/csv'); }

/* ---------- notifikacije ---------- */
function notify(title, body) { try { if (S.settings.notif && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body, icon: faviconData() }); } catch (e) { } }
function notifyOverdueOnLoad() { const al = fleetAlerts(); if (al.bad) notify(`TRAILCOMMAND: ${al.bad} ${t('overdue_items').toLowerCase()}`, S.vehicles.flatMap(v => v.services.filter(s => svcStatus(v, s).level === 'bad').map(s => v.name + ': ' + s.name)).slice(0, 4).join('\n')); }
function faviconData() { return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0b0f14"/><path d="M10 44l10-22 10 15 7-10 11 17" stroke="#00e5ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="16" r="5" fill="#ffb020"/></svg>`); }
</script>
<script>
/* ================================================================== */
/*  DODATNI MODULI – checklist, planer, SOS, analitika, tim, settings */

/* ---------- PRE-RIDE CHECKLIST ---------- */
const CHECK_TPL = {
  enduro: ['Nivo ulja u motoru', 'Nivo rashladne tečnosti', 'Pritisak guma (0,9 bar)', 'Lanac – zategnutost i podmazivanje', 'Kočnice – pedala i ručica', 'Kvačilo – luft', 'Svetla i prekidači', 'Zavrtnji točkova / osovine', 'Vazdušni filter čist', 'Gorivo – pun rezervoar', 'Zaštitna oprema (kaciga, čizme, štitnici)', 'Alat i rezervna guma / lepak', 'Voda i hrana', 'Telefon pun + GPS'],
  utv: ['Nivo ulja u motoru', 'Rashladna tečnost', 'Pritisak guma (14 psi)', 'CVT kaiš – vizuelna kontrola', 'Kočnice', 'Volan – luft', 'Svetla i sirena', 'Sigurnosni pojasevi', 'Matice točkova', 'Vitlo / sajla funkcioniše', 'Gorivo – pun rezervoar + rezerva', 'Prva pomoć i aparat za gašenje', 'Radio / telefon', 'Dozvole / dokumenta'],
};
let checkVid = null;
function renderChecklist() {
  const v = S.vehicles.find(x => x.id === checkVid) || S.vehicles[0]; if (!v) { $('#v-checklist').innerHTML = '<div class="empty">Dodaj vozilo.</div>'; return; } checkVid = v.id;
  const hist = S.checklists.filter(c => c.vehicleId === v.id).sort((a, b) => b.date.localeCompare(a.date));
  const tpl = CHECK_TPL[v.type] || CHECK_TPL.enduro;
  $('#v-checklist').innerHTML = `<div class="vhead"><h1>${t('nav_checklist')}<small>PRE-RIDE INSPECTION · ${esc(v.name)}</small></h1></div>
    <div class="vsel">${S.vehicles.map(x => `<button class="${x.id === v.id ? 'active' : ''}" data-act="selCheckVeh" data-id="${x.id}">${ic(x.type === 'utv' ? 'buggy' : 'moto')}${esc(x.name)}</button>`).join('')}</div>
    <div class="grid g2"><div class="card"><h3>${ic('checklist')} Lista <span class="r"><span class="tag info" id="ckProg">0/${tpl.length}</span></span></h3><div id="ckItems">${tpl.map((it, i) => `<label class="chk"><input type="checkbox" data-i="${i}"><span>${esc(it)}</span></label>`).join('')}</div>
      <label class="f">Potpis (crtaj prstom)</label><canvas class="sig" id="sigPad"></canvas><div class="chips" style="margin-top:6px"><button class="btn xs ghost" id="sigClear">Obriši potpis</button><span class="muted" style="font-size:11px">${me().name} · ${fmtD(today())}</span></div>
      <label class="f">${t('notes')}</label><input id="ckNotes"><button class="btn primary full" id="ckSave" style="margin-top:12px">${ic('check')} Potvrdi i sačuvaj</button></div>
    <div class="card"><h3>Istorija (${hist.length})</h3>${hist.slice(0, 15).map(c => `<div class="li"><span class="tag ${c.items.every(i => i.ok) ? 'ok' : 'warn'}">${c.items.filter(i => i.ok).length}/${c.items.length}</span><div class="t"><b>${fmtD(c.date)} – ${esc(c.user)}</b><small>${esc(c.notes) || (c.items.filter(i => !i.ok).map(i => i.t).join(', ') || 'sve OK')}</small></div>${c.sig ? `<img src="${c.sig}" style="height:30px;background:#fff;border-radius:4px">` : ''}</div>`).join('') || '<div class="empty">Nema sačuvanih lista</div>'}</div></div>`;
  const prog = () => $('#ckProg').textContent = $$('#ckItems input:checked').length + '/' + tpl.length; $('#ckItems').onchange = prog;
  const cv = $('#sigPad'); cv.width = cv.offsetWidth * 2; cv.height = 240; const ctx = cv.getContext('2d'); ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; let drawing = false, signed = false;
  const pos = e => { const r = cv.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * 2, (p.clientY - r.top) * 2]; };
  const st = e => { drawing = true; signed = true; ctx.beginPath(); ctx.moveTo(...pos(e)); e.preventDefault(); }; const mv = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); e.preventDefault(); }; const en = () => drawing = false;
  cv.onmousedown = st; cv.onmousemove = mv; cv.onmouseup = en; cv.onmouseleave = en; cv.ontouchstart = st; cv.ontouchmove = mv; cv.ontouchend = en;
  $('#sigClear').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); signed = false; };
  $('#ckSave').onclick = () => { const items = tpl.map((tt, i) => ({ t: tt, ok: $(`#ckItems input[data-i="${i}"]`).checked })); if (!signed) { toast('Potpiši listu', true); return; } mutate(s => s.checklists.push({ id: uid(), vehicleId: v.id, date: today(), user: me().name, items, notes: formVal('ckNotes'), sig: cv.toDataURL('image/png') }), `potvrdio pre-ride listu za ${v.name} (${items.filter(i => i.ok).length}/${items.length})`); };

/* ---------- PLANER IZLAZAKA ---------- */
function renderPlanner() {
  const list = S.events.slice().sort((a, b) => a.date.localeCompare(b.date)); const up = list.filter(e => e.date >= today()), past = list.filter(e => e.date < today());
  const card = e => { const r = S.routes.find(x => x.id === e.routeId); const joined = e.participants.includes(me().name); return `<div class="card ${e.date < today() ? '' : daysBetween(today(), e.date) <= 7 ? 'amber' : ''}"><h3>${ic('planner')} ${esc(e.title)} <span class="r"><span class="tag ${e.date < today() ? 'dim' : 'info'}">${fmtD(e.date)} · ${e.date >= today() ? daysBetween(today(), e.date) + 'd' : 'prošlo'}</span></span></h3>
      <div class="chips" style="margin-bottom:8px">${e.poiId ? `<button class="chip" data-act="focusPoi" data-id="${e.poiId}">${ic('pin', '')} ${esc(pname(e.poiId))}</button>` : ''}${r ? `<span class="chip">${esc(r.name)} · ${U.dist(pathLength(r.points))}</span>` : ''}<span class="chip">${esc(e.author || '')}</span></div>
      ${e.notes ? `<p class="muted" style="font-size:12px;margin:0 0 8px">${esc(e.notes)}</p>` : ''}

      <div><h3 style="font-size:11px">Oprema</h3>${e.gear.map((g, i) => `<label class="chk" style="padding:3px 0;font-size:12px;${g.ok ? 'color:var(--muted)' : ''}"><input type="checkbox" ${g.ok ? 'checked' : ''} data-act="gearToggle" data-id="${e.id}" data-i="${i}"> ${esc(g.t)}</label>`).join('')}</div></div>
      <div class="actions" style="margin-top:10px">${e.date >= today() ? `<button class="btn sm ${joined ? 'amber' : 'primary'}" data-act="joinEvent" data-id="${e.id}">${joined ? 'Odjavi se' : ic('check') + ' Prijavi se'}</button>` : ''}${can('edit', e.authorId) ? `<button class="btn sm" data-act="eventForm" data-id="${e.id}">${ic('edit')}</button>` : ''}</div></div>`; };
  $('#v-planner').innerHTML = `<div class="vhead"><h1>${t('nav_planner')}<small>RIDE PLANNER · ${up.length} UPCOMING</small></h1><div class="tools"><button class="btn sm primary" data-act="eventForm">${ic('plus')} Novi izlazak</button></div></div>
    <div class="grid g2">${up.map(card).join('') || '<div class="empty">Nema planiranih izlazaka</div>'}</div>${past.length ? `<h3 style="margin:18px 0 10px">Prošli</h3><div class="grid g2">${past.slice(-4).reverse().map(card).join('')}</div>` : ''}`;
}
function eventForm(id) {
  const e = id ? S.events.find(x => x.id === id) : { title: '', date: today(), routeId: '', poiId: '', participants: [me().name], gear: [{ t: 'Rezervno gorivo', ok: false }, { t: 'Prva pomoć', ok: false }, { t: 'Alat', ok: false }], notes: '' }; if (!requirePerm(id ? 'edit' : 'add', e.authorId)) return;
  openModal(`${modalHead(id ? e.title : 'Novi izlazak', 'planner')}<label class="f">Naziv *</label><input id="ev-title" value="${esc(e.title)}"><div class="f2"><div><label class="f">${t('date')}</label><input id="ev-date" type="date" value="${e.date}"></div><div><label class="f">Tačka na mapi</label><select id="ev-poi"><option value="">—</option>${S.pois.map(p => `<option value="${p.id}" ${e.poiId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>
    <label class="f">${t('route')}</label><select id="ev-route"><option value="">—</option>${S.routes.map(r => `<option value="${r.id}" ${e.routeId === r.id ? 'selected' : ''}>${esc(r.name)} (${U.dist(pathLength(r.points))})</option>`).join('')}</select>

    <div class="actions">${id ? `<button class="btn danger" id="ev-del">${ic('trash')}</button>` : ''}<button class="btn ghost" data-act="closeModal">${t('cancel')}</button><button class="btn primary" id="ev-save">${t('save')}</button></div>`);
  $('#ev-save').onclick = () => { if (!validate(['ev-title'])) return; const gearT = formVal('ev-gear').split('\n').map(x => x.trim()).filter(Boolean); const rec = { title: formVal('ev-title').trim(), date: formVal('ev-date'), poiId: formVal('ev-poi'), routeId: formVal('ev-route'), participants: formVal('ev-part').split(',').map(x => x.trim()).filter(Boolean), gear: gearT.map(tt => ({ t: tt, ok: e.gear.find(g => g.t === tt)?.ok || false })), notes: formVal('ev-notes') }; mutate(s => { if (id) Object.assign(s.events.find(x => x.id === id), rec); else s.events.push({ id: uid(), author: me().name, authorId: me().id, ...rec }); }, (id ? 'izmenio izlazak „' : 'planirao izlazak „') + rec.title + '"'); closeModal(); };

  const topPoi = Object.entries(byPoi).sort((a, b) => b[1].n - a[1].n).slice(0, 6);
  const condCount = {}; S.trips.forEach(tr => (tr.conditions || []).forEach(c => condCount[c] = (condCount[c] || 0) + 1));

      ${[['Sati ukupno', v => n1(v.hours)], ['Km ukupno', v => n0(v.km)], ['Vožnji (12 m)', v => S.trips.filter(x => x.vehicleId === v.id && months.includes(monthKey(x.date))).length], ['Sati (12 m)', v => n1(S.trips.filter(x => x.vehicleId === v.id && months.includes(monthKey(x.date))).reduce((a, x) => a + x.hours, 0))], ['Prosek h / vožnja', v => { const tr = S.trips.filter(x => x.vehicleId === v.id); return tr.length ? n1(tr.reduce((a, x) => a + x.hours, 0) / tr.length) : '—'; }], ['Trošak / h', v => v.hours ? money(costRows().filter(r => r.vehicleId === v.id).reduce((a, r) => a + r.amt, 0) / v.hours) : '—'], ['Potrošnja L/h', v => fuelAvg(v).perH ? n1(fuelAvg(v).perH) : '—'], ['Prekoračeni intervali', v => v.services.filter(s => svcStatus(v, s).level === 'bad').length]].map(([l, f]) => `<tr><td>${l}</td>${S.vehicles.map(v => `<td class="num">${f(v)}</td>`).join('')}</tr>`).join('')}</table></div>

  new Chart($('#anHours'), { type: 'line', data: { labels: months.map(m => m.slice(2)), datasets: S.vehicles.map((v, i) => ({ label: v.name, data: months.map(m => S.trips.filter(x => x.vehicleId === v.id && monthKey(x.date) === m).reduce((a, x) => a + x.hours, 0)), borderColor: colors[i % 4], backgroundColor: colors[i % 4] + '22', fill: true, tension: .35, pointRadius: 3 })) }, options: chartOpts({ legend: true, zero: true, y: 'h' }) });

function applyTheme() { document.documentElement.dataset.theme = S.settings.theme; $('meta[name=theme-color]').content = S.settings.theme === 'dark' ? '#0b0f14' : '#eef2f6'; }
async function cacheTiles() {
  if (!map) { toast('Otvori prvo mapu', true); return; } if (!navigator.serviceWorker?.controller) { toast('Service worker nije aktivan (treba sw.js + HTTPS)', true); return; }
  const b = map.getBounds(), z0 = Math.max(10, map.getZoom()), urls = []; const tpl = S.settings.mapLayer === 'sat' ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' : S.settings.mapLayer === 'topo' ? 'https://a.tile.opentopomap.org/{z}/{x}/{y}.png' : 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png';
  const t2 = (lat, lng, z) => [Math.floor((lng + 180) / 360 * 2 ** z), Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * 2 ** z)];
  for (let z = z0; z <= Math.min(z0 + 3, 16); z++) { const [x1, y1] = t2(b.getNorth(), b.getWest(), z), [x2, y2] = t2(b.getSouth(), b.getEast(), z); for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) urls.push(tpl.replace('{z}', z).replace('{x}', x).replace('{y}', y)); if (urls.length > 600) break; }
  toast(`Preuzimam ${urls.length} pločica…`); let ok = 0; for (const u of urls.slice(0, 600)) { try { await fetch(u, { mode: 'no-cors' }); ok++; } catch (e) { } } toast(`Keširano ${ok} pločica za offline`);
}
