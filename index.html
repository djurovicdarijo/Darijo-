<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TrailCommand – Off-Road Operations & Fleet Maintenance</title>
<link rel="manifest" id="manifestLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* =====================================================================
   TrailCommand – modern dark UI
   ===================================================================== */
:root{
  --bg:#0f1115; --bg2:#13161c; --panel:#171a21; --panel2:#1d2129; --hover:#222731;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
  --text:#eef0f3; --muted:#9aa3b2; --dim:#667080;
  --accent:#ff6a1f; --accent2:rgba(255,106,31,.14); --accent3:#ffa366;
  --green:#34d399; --red:#f87171; --yellow:#fbbf24; --blue:#60a5fa; --purple:#a78bfa; --cyan:#22d3ee;
  --r:16px; --r2:12px; --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sidebar:240px; --topbar:60px; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#eceef1; --panel:#ffffff; --panel2:#f7f8fa; --hover:#eef0f3;
  --line:rgba(16,24,40,.08); --line2:rgba(16,24,40,.14);
  --text:#111827; --muted:#5b6474; --dim:#8a94a6;
  --accent:#ea580c; --accent2:rgba(234,88,12,.1); --accent3:#c2410c;
  --green:#059669; --red:#dc2626; --yellow:#d97706; --blue:#2563eb; --purple:#7c3aed; --cyan:#0891b2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}
a{color:var(--accent3)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:17px}h3{font-size:13px;color:var(--muted);font-weight:600}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid var(--bg)}

/* ---- layout ---- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--topbar) 1fr;height:100%;padding-top:env(safe-area-inset-top)}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.logo .mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.tb-sp{flex:1}
.clock{font-family:var(--mono);font-size:12px;text-align:right;line-height:1.25;color:var(--muted)}
.clock b{font-size:14px;color:var(--text);font-weight:500}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:6px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.conn.off i{background:var(--red)}.conn.cloud i{background:var(--blue)}
.user{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 10px 5px 5px;border:1px solid var(--line);border-radius:20px;cursor:pointer;background:var(--panel)}
.user:hover{background:var(--hover)}
.user .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.user .role{color:var(--muted);font-size:11px}
.ibtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;transition:.15s}
.ibtn:hover{color:var(--text);background:var(--hover)}
.ibtn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

#sidebar{border-right:1px solid var(--line);background:var(--bg);overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
#sidebar .sec{font-size:11px;font-weight:600;color:var(--dim);padding:14px 12px 6px}
.navb{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);cursor:pointer;border:0;font-size:13.5px;font-weight:500;background:none;width:100%;text-align:left;font-family:inherit;transition:.12s}
.navb:hover{color:var(--text);background:var(--hover)}
.navb.active{color:var(--text);background:var(--panel2)}
.navb.active svg{color:var(--accent)}
.navb .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px}
.navb .badge.amber{background:var(--yellow);color:#000}

#main{overflow:auto;padding:22px 24px 48px;position:relative}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.vhead h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.vhead h1 small{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:2px}
.vhead .tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;box-shadow:var(--shadow);animation:fade .35s ease both}
.card.amber{border-color:rgba(251,191,36,.35)}
.card.red{border-color:rgba(248,113,113,.4)}
.card h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;display:flex;gap:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stat .val{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--text);line-height:1.1;letter-spacing:-.02em}
.stat .val.amber{color:var(--yellow)}.stat .val.red{color:var(--red)}.stat .val.green{color:var(--green)}.stat .val.accent{color:var(--accent)}
.stat .val small{font-size:12px;color:var(--muted);margin-left:4px;font-family:var(--sans);font-weight:400}
.stat .sub{font-size:12px;color:var(--muted)}
.corner{display:none}

/* ---- buttons / forms ---- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.amber{background:rgba(251,191,36,.12);color:var(--yellow);border-color:rgba(251,191,36,.3)}
.btn.danger{background:rgba(248,113,113,.1);color:var(--red);border-color:rgba(248,113,113,.3)}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent}
.btn.ghost:hover{color:var(--text);background:var(--hover)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.xs{padding:4px 8px;font-size:11.5px;border-radius:7px}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:500;margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
input.err{border-color:var(--red)}
input[type=number]{font-family:var(--mono)}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{min-height:68px;resize:vertical}
select option{background:#171a21;color:#fff}
[data-theme="light"] select option{background:#fff;color:#111}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);cursor:pointer;background:none;font-family:inherit}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid transparent}
.tag.ok{color:var(--green);background:rgba(52,211,153,.12)}.tag.warn{color:var(--yellow);background:rgba(251,191,36,.12)}.tag.bad{color:var(--red);background:rgba(248,113,113,.14)}
.tag.info{color:var(--accent3);background:var(--accent2)}.tag.dim{color:var(--muted);background:var(--panel2);border-color:var(--line)}

/* ---- tables / lists ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line2)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{font-family:var(--mono);text-align:right}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:var(--hover)}
.tscroll{overflow:auto;-webkit-overflow-scrolling:touch}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:600}.li .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mono{font-size:12px}
.empty{text-align:center;color:var(--dim);padding:28px 10px;font-size:13px}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.ok{background:var(--green)}.bar i.warn{background:var(--yellow)}.bar i.bad{background:var(--red)}
.diff{display:inline-flex;gap:2px;vertical-align:middle}.diff i{width:8px;height:8px;border-radius:2px;background:var(--line2)}
.diff i.on{background:var(--accent)}

/* ---- gauges ---- */
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gauge{text-align:center;padding:14px 8px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);cursor:pointer;transition:.12s}
.gauge:hover{border-color:var(--line2);background:var(--hover)}
.gauge svg{width:110px;height:62px;display:block;margin:0 auto}
.gauge .gv{font-family:var(--mono);font-size:18px;margin-top:2px;font-weight:600}
.gauge .gn{font-size:12px;color:var(--text);margin-top:4px;line-height:1.3;min-height:30px;font-weight:500}
.gauge .gs{font-size:11px;font-family:var(--mono);color:var(--muted);margin-top:2px}
.gauge.bad{border-color:rgba(248,113,113,.45)}

/* ---- map ---- */
#map{height:calc(100vh - var(--topbar) - 130px);min-height:380px;border-radius:var(--r);border:1px solid var(--line);background:#1a1d24;z-index:1}
.maprow{display:grid;grid-template-columns:1fr 330px;gap:14px}
.mapside{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - var(--topbar) - 130px);overflow:auto}
.leaflet-container{font-family:var(--sans);background:#1a1d24}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1d2129;color:#eef0f3;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:12px}
.leaflet-popup-content{margin:12px 14px;font-size:13px;min-width:200px}
.leaflet-popup-content b.t{font-size:14px;display:block;margin-bottom:4px}
.leaflet-bar a{background:#1d2129;color:#eef0f3;border-color:rgba(255,255,255,.1)}
.leaflet-bar a:hover{background:#262b35}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#9aa3b2!important;font-size:9px}
.leaflet-control-attribution a{color:#9aa3b2!important}
.pin{position:relative;width:30px;height:30px}
.pin .b{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #0f1115;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pin svg{position:absolute;left:7px;top:6px;width:16px;height:16px;stroke:#0f1115;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pin.me .b{border-radius:50%;transform:none;background:var(--blue);box-shadow:0 0 0 6px rgba(96,165,250,.25)}
.maptb{position:absolute;top:12px;left:56px;z-index:800;display:flex;gap:6px;flex-wrap:wrap}
.maptb .btn{background:rgba(29,33,41,.92);color:#eef0f3;border-color:rgba(255,255,255,.1)}
.maptb .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.photo-grid{display:flex;gap:6px;flex-wrap:wrap}
.photo-grid img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);cursor:pointer}
.wx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.wx .v{font-family:var(--mono);font-size:18px;font-weight:600}
.wx .l{font-size:11px;color:var(--muted)}
.comment{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.comment b{color:var(--accent3)}.comment small{color:var(--dim);margin-left:6px}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.65);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fade .2s ease}
.sheet.wide{max-width:900px}
.sheet h2{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheet h2 .x{margin-left:auto}
.actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:9500;pointer-events:none;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--red)}
.toast .undo{pointer-events:auto;color:var(--accent3);cursor:pointer;font-weight:600}
.search-res{max-height:50vh;overflow:auto;margin-top:10px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--muted)}
.feed{font-size:12.5px}
.feed .li small{white-space:normal}
.online{display:flex;gap:6px;flex-wrap:wrap}
.online span{display:flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border:1px solid var(--line2);border-radius:20px}
.online i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.vsel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.vsel button{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:9px 14px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.vsel button.active{border-color:var(--accent);color:var(--text);background:var(--accent2)}
.vsel .st{width:8px;height:8px;border-radius:50%}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:12.5px}
.spec div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.spec div span:first-child{color:var(--muted)}
.spec div span:last-child{font-family:var(--mono);text-align:right}
.sos-big{font-family:var(--mono);font-size:20px;text-align:center;padding:14px;border:1px dashed var(--line2);border-radius:12px;margin:10px 0;word-break:break-all;background:var(--bg)}
.sig{border:1px dashed var(--line2);border-radius:10px;background:var(--bg);touch-action:none;width:100%;height:120px}
canvas.chart{width:100%!important;max-height:260px}
.printonly{display:none}
.welcome{background:linear-gradient(135deg,var(--accent2),transparent);border:1px solid var(--line)}

/* ---- mobile ---- */
#bottomnav{display:none}
@media (max-width:900px){
  :root{--sidebar:0px}
  #app{grid-template-columns:1fr}
  #sidebar{display:none}
  #main{padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
  #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
  #bottomnav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 7px;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;position:relative}
  #bottomnav button.active{color:var(--accent)}
  #bottomnav button .badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:9px;padding:0 5px;border-radius:8px;font-weight:600}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .g3 .span2,.g4 .span2{grid-column:span 2}
  .maprow{grid-template-columns:1fr}
  .mapside{max-height:none}
  #map{height:62vh;min-height:320px}
  .clock{display:none}.user .nm{display:none}.conn{display:none}
  .f3{grid-template-columns:1fr 1fr}
  .vhead h1{font-size:20px}
  .stat .val{font-size:24px}
  .spec{grid-template-columns:1fr}
  .maptb{left:12px;top:56px}
}
@media (max-width:480px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g3 .span2,.g4 .span2{grid-column:auto}.f2{grid-template-columns:1fr}.card{padding:14px}
  #topbar{gap:8px;padding:0 12px}.logo>div:last-child{display:none}.ibtn{width:34px;height:34px}.user{padding:4px}.user>div:last-child{display:none}
  .vhead h1{font-size:19px}.vhead h1 small{font-size:12px}.btn.sm{padding:6px 9px;font-size:12px}.gauges{grid-template-columns:repeat(2,1fr)}.stat .val{font-size:22px}}
@media print{
  body{background:#fff;color:#000;overflow:visible}
  #topbar,#sidebar,#bottomnav,.noprint,.modal,.toast{display:none!important}
  #app{display:block}#main{overflow:visible;padding:0}
  .view{display:none!important}.printonly{display:block!important;color:#000}
  .printonly table{font-size:11px}.printonly th,.printonly td{border:1px solid #999;padding:4px 6px;color:#000}
  .printonly h1{font-size:20px}.printonly h2{font-size:15px;margin-top:16px}
}
</style>
</head>
<body>
<div id="app">
  <!-- ================= TOP BAR ================= -->
  <header id="topbar">
    <div class="logo">
      <div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l4-9 4 6 3-4 4 7"/><path d="M2 21h20"/><circle cx="18" cy="5" r="2"/></svg></div>
      <div>TrailCommand<small data-i>tagline</small></div>
    </div>
    <div class="tb-sp"></div>
    <div class="conn" id="conn"><i></i><b data-i>local_mode</b></div>
    <div class="clock"><b id="clock">--:--:--</b><br><span id="clockDate"></span></div>
    <div class="user" data-act="openUser"><div class="av" id="userAv">?</div><div><div class="nm" id="userName">Guest</div><div class="role" id="userRole">guest</div></div></div>

/* ------------------------------------------------------------------ */

const STORE_KEY = 'trailcommand-v2';
let S = null;                 // glavni state
let undoStack = [];           // snimci za undo (poslednjih 10)
let cloud = { enabled: false, db: null, auth: null, user: null, unsub: [] };

function emptyState() {
  return {
    settings: { lang: 'en', theme: 'dark', units: 'km', tempUnit: 'C', notif: false, currentUser: null, firebase: null, view: 'dashboard', mapLayer: 'osm' },
    users: [], vehicles: [], pois: [], routes: [], services: [], trips: [], fuel: [], parts: [], checklists: [], events: [], activity: [], contacts: [],
  };
}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { toast('Could not save (storage full?)', true); } }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { S = Object.assign(emptyState(), JSON.parse(raw)); return; } } catch (e) { }
  S = emptyState(); seedDemo(); persist();
}

/* trenutni korisnik + uloge */
const me = () => S.users.find(u => u.id === S.settings.currentUser) || { id: 'guest', name: t('guest'), role: 'guest' };
const can = (action, ownerId) => { const u = me(); if (u.role === 'admin') return true; if (u.role === 'member') return action === 'add' || (action === 'edit' && (!ownerId || ownerId === u.id)) || (action === 'delete' && ownerId === u.id); return false; };
function requirePerm(action, ownerId) { if (!can(action, ownerId)) { toast(t('no_permission'), true); return false; } return true; }

/* centralna mutacija: undo + aktivnost + persist + cloud + rerender */
function mutate(fn, activityText, opts = {}) {
  undoStack.push(JSON.stringify(S)); if (undoStack.length > 10) undoStack.shift();
  fn(S);
  if (activityText) logActivity(activityText);
  persist();
  if (cloud.enabled && !opts.noCloud) cloudPush();
  renderAll();
  $('#undoBtn').style.opacity = 1;
  if (activityText && !opts.silent) toast(activityText, false, true);
}
function undo() { if (!undoStack.length) { toast('—'); return; } S = JSON.parse(undoStack.pop()); persist(); if (cloud.enabled) cloudPush(); renderAll(); toast(t('undo_done')); if (!undoStack.length) $('#undoBtn').style.opacity = .4; }
function logActivity(text) { S.activity.unshift({ id: uid(), user: me().name, text, date: new Date().toISOString() }); if (S.activity.length > 200) S.activity.length = 200; }

function closeModal() { $('#modal').classList.remove('open'); $('#sheet').innerHTML = ''; }
let toastT;
function toast(msg, err = false, withUndo = false) {
  const el = $('#toast'); el.className = 'toast show' + (err ? ' err' : '');
  el.innerHTML = esc(msg) + (withUndo ? ` <span class="undo" data-act="undo">UNDO</span>` : '');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), withUndo ? 4500 : 2200);
}
function confirmBox(msg, onYes, danger = true) {

}

function readFileAsDataURL(file, maxW = 1200) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image(); img.onload = () => { const s = Math.min(1, maxW / img.width); const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); };
      img.onerror = () => res(r.result); img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function animateCounters(root = document) {
  $$('[data-count]', root).forEach(el => {
    const target = parseFloat(el.dataset.count); const dec = el.dataset.dec ? +el.dataset.dec : 0; const suffix = el.dataset.suffix || '';
    const t0 = performance.now(), dur = 900;

<script>

let map = null, baseLayers = {}, poiLayer = null, routeLayer = null, heatLayer = null, measureLayer = null, drawLayer = null;
let myPos = null, myMarker = null, mode = null /* null | draw | measure */, drawPts = [], measurePts = [], activeRouteId = null;
const SPEED = { enduro: 14, utv: 20, default: 16 }; // prosečna off-road brzina km/h za procenu trajanja

function initMap() {
  if (map || typeof L === 'undefined') { if (!map && $('#map')) $('#map').innerHTML = '<div class="empty">Map library not loaded – an internet connection is needed the first time.</div>'; return; }
  map = L.map('map', { zoomControl: true, attributionControl: true }).setView([43.9, 20.9], 7);
  baseLayers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri World Imagery' }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap (CC-BY-SA)' }),
  };
  setLayer(S.settings.mapLayer || 'osm');
  poiLayer = L.layerGroup().addTo(map); routeLayer = L.layerGroup().addTo(map); measureLayer = L.layerGroup().addTo(map); drawLayer = L.layerGroup().addTo(map);
  map.on('click', e => {
    if (mode === 'draw') { drawPts.push([e.latlng.lat, e.latlng.lng]); redrawDraft(); }
    else if (mode === 'measure') { measurePts.push([e.latlng.lat, e.latlng.lng]); redrawMeasure(); }
    else openPoiForm(null, e.latlng);
  });
  map.on('dblclick', e => { if (mode === 'draw') { L.DomEvent.stop(e); finishDraw(); } });

/* ---------- visinski profil: Open-Elevation, fallback simulacija ---------- */
async function showElevation(id) {
  const r = S.routes.find(x => x.id === id); const box = $('#eleBox'); box.innerHTML = '<div class="muted">Loading elevation…</div>';
  // uzorkuj rutu na max 80 tačaka ravnomerno po dužini
  const total = pathLength(r.points), N = Math.min(80, Math.max(10, Math.round(total * 4))); const samples = []; let acc = 0, seg = 0;
  for (let i = 0; i < N; i++) { const target = total * i / (N - 1); while (seg < r.points.length - 2 && acc + haversine(r.points[seg], r.points[seg + 1]) < target) { acc += haversine(r.points[seg], r.points[seg + 1]); seg++; } const a = r.points[seg], b = r.points[Math.min(seg + 1, r.points.length - 1)]; const L2 = haversine(a, b) || 1; const f = clamp((target - acc) / L2, 0, 1); samples.push({ lat: a[0] + (b[0] - a[0]) * f, lng: a[1] + (b[1] - a[1]) * f, d: target }); }
  let ele = r.ele && r.ele.length === N ? r.ele : null, src = 'cached';
  if (!ele) {
    try { const res = await fetch('https://api.open-elevation.com/api/v1/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ locations: samples.map(s => ({ latitude: s.lat, longitude: s.lng })) }) }); if (!res.ok) throw 0; const j = await res.json(); ele = j.results.map(x => x.elevation); src = 'Open-Elevation'; r.ele = ele; persist(); }
    catch (e) { let h = 600 + Math.random() * 400; ele = samples.map((s, i) => { h += (Math.sin(i / 5) * 18) + (Math.random() - .5) * 25; return Math.round(h); }); src = 'simulated (API unavailable)'; }
  }
  let up = 0, down = 0; for (let i = 1; i < ele.length; i++) { const d = ele[i] - ele[i - 1]; if (d > 0) up += d; else down -= d; }
  box.innerHTML = `<div class="chips" style="margin:8px 0"><span class="tag ok">↑ ${n0(up)} m</span><span class="tag warn">↓ ${n0(down)} m</span><span class="tag dim">min ${n0(Math.min(...ele))} m · max ${n0(Math.max(...ele))} m</span><span class="tag dim">${src}</span></div><canvas class="chart" id="eleChart" height="120"></canvas>`;
  if (typeof Chart === 'undefined') return;
  new Chart($('#eleChart'), { type: 'line', data: { labels: samples.map(s => U.distN(s.d)), datasets: [{ data: ele, borderColor: '#00e5ff', backgroundColor: 'rgba(0,229,255,.15)', fill: true, pointRadius: 0, tension: .3, borderWidth: 2 }] }, options: chartOpts({ x: U.distU(), y: 'm' }) });
}
function chartOpts(axes = {}) {
  const c = getComputedStyle(document.documentElement); const grid = c.getPropertyValue('--line2').trim() || 'rgba(255,255,255,.08)'; const txt = c.getPropertyValue('--muted').trim() || '#8b98a8';
  return { responsive: true, maintainAspectRatio: false, animation: { duration: 700 }, plugins: { legend: { display: axes.legend ?? false, labels: { color: txt, boxWidth: 10 } }, tooltip: { backgroundColor: '#101820', borderColor: '#00e5ff55', borderWidth: 1 } }, scales: { x: { grid: { color: grid }, ticks: { color: txt, maxTicksLimit: 8, font: { family: 'JetBrains Mono', size: 10 } }, title: { display: !!axes.x, text: axes.x, color: txt } }, y: { grid: { color: grid }, ticks: { color: txt, font: { family: 'JetBrains Mono', size: 10 } }, title: { display: !!axes.y, text: axes.y, color: txt }, beginAtZero: axes.zero ?? false } } };
}

/* ---------- GPX / KML ---------- */
function importTrackFile(file) {
  if (!file || !requirePerm('add')) return;
  const rd = new FileReader(); rd.onload = () => {
    try {
      const xml = new DOMParser().parseFromString(rd.result, 'application/xml'); const isKml = /kml/i.test(file.name) || xml.querySelector('kml');
      let tracks = [], wpts = [];
      if (isKml) {
        xml.querySelectorAll('Placemark').forEach(pm => { const name = pm.querySelector('name')?.textContent || file.name; const ls = pm.querySelector('LineString coordinates'); const pt = pm.querySelector('Point coordinates'); if (ls) tracks.push({ name, pts: ls.textContent.trim().split(/\s+/).map(c => c.split(',')).map(c => [+c[1], +c[0]]) }); if (pt) { const c = pt.textContent.trim().split(','); wpts.push({ name, lat: +c[1], lng: +c[0], desc: pm.querySelector('description')?.textContent || '' }); } });
      } else {
        xml.querySelectorAll('trk,rte').forEach(tr => { const name = tr.querySelector('name')?.textContent || file.name; const pts = [...tr.querySelectorAll('trkpt,rtept')].map(p => [+p.getAttribute('lat'), +p.getAttribute('lon')]); if (pts.length > 1) tracks.push({ name, pts, ele: [...tr.querySelectorAll('ele')].map(e => +e.textContent) }); });
        xml.querySelectorAll('wpt').forEach(w => wpts.push({ name: w.querySelector('name')?.textContent || 'Waypoint', lat: +w.getAttribute('lat'), lng: +w.getAttribute('lon'), desc: w.querySelector('desc')?.textContent || '' }));
      }
      if (!tracks.length && !wpts.length) { toast('No routes or points found in the file', true); return; }
      let lastId = null;
      mutate(s => {
        tracks.forEach(tr => { const pts = tr.pts.filter((p, i) => i % Math.max(1, Math.floor(tr.pts.length / 1500)) === 0); lastId = uid(); s.routes.push({ id: lastId, name: tr.name, points: pts, author: me().name, authorId: me().id, date: today(), ele: null }); });
        wpts.forEach(w => s.pois.push({ id: uid(), name: w.name, cat: 'enduro', diff: 2, desc: w.desc, lat: w.lat, lng: w.lng, photos: [], author: me().name, authorId: me().id, date: today(), ratings: [], comments: [], history: [{ user: me().name, date: today(), action: 'imported from ' + file.name }] }));
      }, `imported ${tracks.length} routes and ${wpts.length} points from ${file.name}`);
      if (lastId) showRoute(lastId);
    } catch (e) { toast('Could not read the file', true); }
  }; rd.readAsText(file); $('#gpxFile').value = '';
}
function gpxString(routes, pois) {
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="TRAILCOMMAND" xmlns="http://www.topografix.com/GPX/1/1">\n` +
    pois.map(p => `  <wpt lat="${p.lat}" lon="${p.lng}"><name>${esc(p.name)}</name><desc>${esc(p.desc)}</desc><type>${p.cat}</type></wpt>`).join('\n') + '\n' +
    routes.map(r => `  <trk><name>${esc(r.name)}</name><trkseg>\n${r.points.map((p, i) => `    <trkpt lat="${p[0]}" lon="${p[1]}">${r.ele && r.ele[i] != null ? `<ele>${r.ele[i]}</ele>` : ''}</trkpt>`).join('\n')}\n  </trkseg></trk>`).join('\n') + '\n</gpx>';
}
function kmlString(routes, pois) {
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>TRAILCOMMAND</name>\n` +
    pois.map(p => `<Placemark><name>${esc(p.name)}</name><description>${esc(p.desc)}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('\n') + '\n' +
    routes.map(r => `<Placemark><name>${esc(r.name)}</name><LineString><tessellate>1</tessellate><coordinates>${r.points.map(p => `${p[1]},${p[0]},0`).join(' ')}</coordinates></LineString></Placemark>`).join('\n') + '\n</Document></kml>';
}

/* ---------- heatmap ---------- */
function buildHeat() {
  if (typeof L.heatLayer !== 'function') { toast('Heatmap layer not loaded', true); return; }
  const pts = []; S.pois.forEach(p => pts.push([p.lat, p.lng, .35])); S.trips.forEach(tr => { const p = S.pois.find(x => x.id === tr.poiId); if (p) pts.push([p.lat, p.lng, clamp(tr.hours / 3, .4, 1.2)]); });
  if (heatLayer) map.removeLayer(heatLayer); heatLayer = L.heatLayer(pts, { radius: 35, blur: 25, maxZoom: 11, gradient: { .3: '#0033ff', .6: '#00e5ff', .8: '#ffb020', 1: '#ff4d5e' } }).addTo(map);
}
function toggleHeat() { if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; $('#heatBtn').classList.remove('on'); } else { buildHeat(); $('#heatBtn').classList.add('on'); } }

/* ---------- geolokacija ---------- */
function locate(cb) {
  if (!navigator.geolocation) { toast('GPS not available', true); return; }
  toast('Locating…');
  navigator.geolocation.getCurrentPosition(pos => {
    myPos = [pos.coords.latitude, pos.coords.longitude];
    if (map) { if (myMarker) map.removeLayer(myMarker); myMarker = L.marker(myPos, { icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="pin me" style="width:18px;height:18px"><div class="b"></div></div>' }) }).addTo(map).bindPopup(`You are here<br><button class="btn xs" data-act="poiHere">${ic('plus')} Add point here</button>`); map.setView(myPos, Math.max(map.getZoom(), 13)); renderMapSide(); }
    cb && cb(myPos);
  }, () => toast('Location denied or unavailable', true), { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}

<script>
/* ================================================================== */
/*  FLEET MODUL – vozila, intervali, merači, servisna knjižica,       */
/*  vožnje, gorivo, delovi, troškovi, specifikacije                   */
/* ================================================================== */
let fleetVid = null; const curVeh = () => S.vehicles.find(v => v.id === fleetVid) || S.vehicles[0];

/* status jedne stavke održavanja: istrošenost (0..1+) i preostalo */
function svcStatus(v, s) {
  const parts = [];
  if (s.intH) parts.push({ pct: (v.hours - (s.lastH || 0)) / s.intH, rem: (s.lastH || 0) + s.intH - v.hours, unit: 'h' });
  if (s.intKm) parts.push({ pct: (v.km - (s.lastKm || 0)) / s.intKm, rem: (s.lastKm || 0) + s.intKm - v.km, unit: 'km' });
  if (s.intM && s.lastDate) { const d = daysBetween(s.lastDate, today()); parts.push({ pct: d / (s.intM * 30.4), rem: Math.round(s.intM * 30.4 - d), unit: t('days') }); }
  if (!parts.length) return { pct: 0, rem: Infinity, unit: '', level: 'ok', text: '—' };
  const w = parts.reduce((a, b) => b.pct > a.pct ? b : a);
  const level = w.pct >= 1 ? 'bad' : w.pct >= .8 ? 'warn' : 'ok';
  const ar = Math.abs(w.rem); const text = w.unit === 'h' ? n1(ar) + ' h' : w.unit === 'km' ? n0(ar) + ' km' : n0(ar) + ' ' + t('days');
  return { pct: w.pct, rem: w.rem, unit: w.unit, level, text, all: parts };
}
function fleetAlerts() { let bad = 0, warn = 0; S.vehicles.forEach(v => v.services.forEach(s => { const l = svcStatus(v, s).level; if (l === 'bad') bad++; else if (l === 'warn') warn++; })); return { bad, warn }; }
const lowParts = () => S.parts.filter(p => p.qty <= p.min);
const lastServiceOf = v => S.services.filter(s => s.vehicleId === v.id).sort((a, b) => b.date.localeCompare(a.date))[0];
function nextSvc(v) { return v.services.map(s => ({ s, st: svcStatus(v, s) })).sort((a, b) => b.st.pct - a.st.pct)[0]; }
function expiryTag(d, label) { if (!d) return ''; const n = daysBetween(today(), d); return `<span class="tag ${n < 0 ? 'bad' : n < 30 ? 'warn' : 'ok'}">${label}: ${n < 0 ? t('expired') : fmtD(d) + ' (' + n + ' ' + t('days') + ')'}</span>`; }

/* SVG polukružni merač */
function gaugeSvg(pct, level) {
  const p = clamp(pct, 0, 1); const r = 42, cx = 55, cy = 55; const a = Math.PI * (1 - p); const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  const col = level === 'bad' ? 'var(--red)' : level === 'warn' ? 'var(--yellow)' : 'var(--green)';
  const arc = (from, to, color, w = 7) => { const a1 = Math.PI * (1 - from), a2 = Math.PI * (1 - to); return `<path d="M${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)} A${r} ${r} 0 ${to - from > .5 ? 1 : 0} 1 ${cx + r * Math.cos(a2)} ${cy - r * Math.sin(a2)}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="butt"/>`; };
  return `<svg viewBox="0 0 110 62">${arc(0, .8, 'rgba(46,230,166,.18)')}${arc(.8, 1, 'rgba(255,210,63,.18)')}${arc(.98, 1, 'rgba(255,77,94,.4)')}
    ${p > 0 ? arc(0, p, col) : ''}<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--text)"/></svg>`;
}
function vehSelector() { return `<div class="vsel">${S.vehicles.map(v => { const n = nextSvc(v); return `<button class="${curVeh()?.id === v.id ? 'active' : ''}" data-act="selVeh" data-id="${v.id}">${ic(v.type === 'utv' ? 'buggy' : 'moto')}${esc(v.name)}<span class="st" style="background:var(--${n?.st.level === 'bad' ? 'red' : n?.st.level === 'warn' ? 'yellow' : 'green'})"></span></button>`; }).join('')}<button data-act="vehForm">${ic('plus')} ${t('vehicle')}</button></div>`; }

/* ---------- DASHBOARD ---------- */
function renderDashboard() {

  const warnings = [];
  S.vehicles.forEach(v => { v.services.forEach(s => { const st = svcStatus(v, s); if (st.level !== 'ok') warnings.push({ v, s, st }); }); ['regExpiry', 'insExpiry'].forEach(k => { if (v[k] && daysBetween(today(), v[k]) < 30) warnings.push({ v, s: { name: (k === 'regExpiry' ? t('registration') : t('insurance')) + ' ' + t('expires') + ' ' + fmtD(v[k]) }, st: { level: daysBetween(today(), v[k]) < 0 ? 'bad' : 'warn', text: daysBetween(today(), v[k]) + ' ' + t('days'), pct: 1 } }); }); });
  warnings.sort((a, b) => b.st.pct - a.st.pct);
  const month = monthKey(today()); const mHours = S.trips.filter(x => monthKey(x.date) === month).reduce((a, x) => a + x.hours, 0);
  const needSetup = S.vehicles.filter(v => !v.hours && !v.km && !S.trips.some(x => x.vehicleId === v.id));
  $('#v-dashboard').innerHTML = `${needSetup.length ? `<div class="card welcome" style="margin-bottom:14px"><h3 style="color:var(--text)">${ic('fleet')} Welcome – set your starting point</h3><p class="muted" style="font-size:13px;margin:0 0 10px">Enter the current hour-meter reading and mileage for ${needSetup.map(v => '<b>' + esc(v.name) + '</b>').join(' and ')} so the maintenance intervals count from the right place. You can also mark when each item was last done in Fleet → Maintenance status.</p><div class="chips">${needSetup.map(v => `<button class="btn sm primary" data-act="vehForm" data-id="${v.id}">${ic('edit')} Set up ${esc(v.name)}</button>`).join('')}</div></div>` : ''}<div class="vhead"><h1>${t('nav_dashboard')}<small>${S.vehicles.length} vehicles · ${S.pois.length} map points · ${S.trips.length} trips logged</small></h1><div class="tools"><button class="btn sm" data-act="tripForm">${ic('trips')} ${t('add_trip')}</button><button class="btn sm" data-act="svcForm">${ic('service')} ${t('add_service')}</button><button class="btn sm" data-act="go" data-v="map">${ic('map')} ${t('nav_map')}</button></div></div>
    <div class="grid g4">
      <div class="card stat"><span class="corner tl"></span><span class="corner br"></span><div class="lbl">${t('total_hours')}</div><div class="val" data-count="${totH}" data-dec="1">0</div><div class="sub">${t('all_vehicles')}</div></div>
      <div class="card stat"><div class="lbl">${t('total_km')}</div><div class="val" data-count="${U.distN(totKm)}" data-dec="0">0</div><div class="sub">${U.distU()}</div></div>
      <div class="card stat ${al.bad ? 'red' : al.warn ? 'amber' : ''}"><div class="lbl">${t('overdue_items')}</div><div class="val ${al.bad ? 'red' : al.warn ? 'amber' : 'green'}" data-count="${al.bad}">0</div><div class="sub">${al.warn} ${t('soon').toLowerCase()}</div></div>
      <div class="card stat"><div class="lbl">Hours this month</div><div class="val amber" data-count="${mHours}" data-dec="1">0</div><div class="sub">${S.trips.filter(x => monthKey(x.date) === month).length} trips</div></div>
    </div>
    <div class="grid g3" style="margin-top:14px">
      <div class="card span2"><h3>${ic('warn')} ${t('warnings')} <span class="r"><span class="tag bad">${al.bad} ${t('urgent')}</span><span class="tag warn">${al.warn} ${t('soon')}</span></span></h3>
        ${warnings.length ? warnings.slice(0, 8).map(w => `<div class="li" style="cursor:pointer" data-act="goFleet" data-id="${w.v.id}"><span class="tag ${w.st.level}">${w.st.level === 'bad' ? t('urgent') : t('soon')}</span><div class="t"><b>${esc(w.s.name)}</b><small>${esc(w.v.name)}</small></div><span class="mono" style="color:var(--${w.st.level === 'bad' ? 'red' : 'yellow'})">${w.st.rem < 0 ? 'Overdue ' : ''}${esc(w.st.text)}</span></div>`).join('') : `<div class="empty">${ic('check')} Everything is in the green.</div>`}</div>
      <div class="card"><h3>${ic('planner')} ${t('nav_planner')}</h3>${upcoming.length ? upcoming.map(e => `<div class="li" data-act="goView" data-id="planner" style="cursor:pointer"><div class="t"><b>${esc(e.title)}</b><small>${fmtD(e.date)} · ${e.participants.length} riders</small></div><span class="mono" style="color:var(--cyan)">${daysBetween(today(), e.date)}d</span></div>`).join('') : '<div class="empty">No rides planned</div>'}</div>
    </div>
    <div class="grid g2" style="margin-top:14px">${S.vehicles.map(v => { const n = nextSvc(v); const ls = lastServiceOf(v); return `<div class="card" style="cursor:pointer" data-act="goFleet" data-id="${v.id}"><h3>${ic(v.type === 'utv' ? 'buggy' : 'moto')} ${esc(v.name)} <span class="r">${expiryTag(v.regExpiry, 'REG')}</span></h3>
        <div class="grid g3" style="gap:8px"><div class="stat"><div class="lbl">${t('hours')}</div><div class="val" style="font-size:22px">${n1(v.hours)}</div></div><div class="stat"><div class="lbl">${U.distU()}</div><div class="val" style="font-size:22px">${n0(U.distN(v.km))}</div></div><div class="stat"><div class="lbl">${t('since_service')}</div><div class="val amber" style="font-size:22px">${ls ? n1(v.hours - ls.hours) : '—'}</div></div></div>
        ${n ? `<div style="margin-top:10px;font-size:12px" class="muted">${t('next_service')}: <b style="color:var(--text)">${esc(n.s.name)}</b> · <span class="mono" style="color:var(--${n.st.level === 'bad' ? 'red' : n.st.level === 'warn' ? 'yellow' : 'green'})">${n.st.rem < 0 ? 'Overdue ' : ''}${n.st.text}</span></div><div class="bar" style="margin-top:6px"><i class="${n.st.level}" style="width:${clamp(n.st.pct * 100, 0, 100)}%"></i></div>` : ''}</div>`; }).join('')}</div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>${ic('team')} ${t('activity')}</h3><div class="feed">${S.activity.length ? '' : '<div class="empty">Your logged trips, services and map edits will show up here.</div>'}${S.activity.slice(0, 6).map(a => `<div class="li"><div class="av" style="width:24px;height:24px;border-radius:50%;background:var(--cyan2);color:var(--cyan);display:grid;place-items:center;font-size:11px;font-weight:700">${esc(a.user.slice(0, 1))}</div><div class="t"><small style="color:var(--text)"><b>${esc(a.user)}</b> ${esc(a.text)}</small><small>${new Date(a.date).toLocaleString('sr-Latn')}</small></div></div>`).join('')}</div></div>
      <div class="card"><h3>${ic('parts')} Parts running low</h3>${lowParts().length ? lowParts().map(p => `<div class="li"><span class="tag warn">${p.qty}/${p.min}</span><div class="t"><b>${esc(p.name)}</b><small>${esc(p.partNo)} · ${vname(p.vehicleId)}</small></div></div>`).join('') : '<div class="empty">Inventory OK</div>'}</div></div>`;
  animateCounters($('#v-dashboard'));
}

/* ---------- FLOTA ---------- */
function renderFleet() {
  const v = curVeh(); if (!v) { $('#v-fleet').innerHTML = `<div class="vhead"><h1>${t('nav_fleet')}</h1></div>${vehSelector()}<div class="empty">Add your first vehicle.</div>`; return; }
  const ls = lastServiceOf(v); const n = nextSvc(v); const items = v.services.map(s => ({ s, st: svcStatus(v, s) })).sort((a, b) => b.st.pct - a.st.pct); const urgent = items.filter(i => i.st.level === 'bad');
  const fuelL = S.fuel.filter(f => f.vehicleId === v.id); const trips = S.trips.filter(x => x.vehicleId === v.id);
  $('#v-fleet').innerHTML = `<div class="vhead"><h1>${esc(v.name)}<small>${[v.brand, v.model, v.year].filter(Boolean).join(' · ') || 'Vehicle'}${v.vin ? ' · VIN ' + esc(v.vin) : ''}</small></h1>
      <div class="tools"><button class="btn sm" data-act="tripForm" data-id="${v.id}">${ic('trips')} ${t('add_trip')}</button><button class="btn sm primary" data-act="svcForm" data-id="${v.id}">${ic('service')} ${t('add_service')}</button><button class="btn sm" data-act="vehForm" data-id="${v.id}">${ic('edit')}</button></div></div>
    ${vehSelector()}
    <div class="grid g4">
      <div class="card stat"><span class="corner tl"></span><span class="corner br"></span><div class="lbl">${t('total_hours')}</div><div class="val" data-count="${v.hours}" data-dec="1">0</div><div class="sub">${trips.length} trips logged</div></div>
      <div class="card stat"><div class="lbl">${t('total_km')}</div><div class="val" data-count="${U.distN(v.km)}">0</div><div class="sub">${U.distU()}</div></div>
      <div class="card stat"><div class="lbl">${t('since_service')}</div><div class="val amber" data-count="${ls ? v.hours - ls.hours : 0}" data-dec="1">0</div><div class="sub">${ls ? fmtD(ls.date) + ' · ' + esc(ls.desc).slice(0, 30) : '—'}</div></div>
      <div class="card stat ${n?.st.level === 'bad' ? 'red' : n?.st.level === 'warn' ? 'amber' : ''}"><div class="lbl">${t('next_service')}</div><div class="val ${n?.st.level === 'bad' ? 'red' : n?.st.level === 'warn' ? 'amber' : 'green'}" style="font-size:22px">${n ? (n.st.rem < 0 ? 'Overdue ' : '') + esc(n.st.text) : '—'}</div><div class="sub">${n ? esc(n.s.name) : ''}</div></div>
    </div>
    ${urgent.length ? `<div class="card red" style="margin-top:14px"><h3 style="color:var(--red)">${ic('warn')} ${t('urgent')} – ${t('overdue_items')} (${urgent.length})</h3>${urgent.map(i => `<div class="li"><span class="tag bad">${n0(clamp(i.st.pct, 0, 9) * 100)}%</span><div class="t"><b>${esc(i.s.name)}</b><small>${esc(i.s.note)}</small></div><button class="btn xs" data-act="svcForm" data-id="${v.id}" data-item="${i.s.id}">${ic('check')} Done</button></div>`).join('')}</div>` : ''}
    <div class="card" style="margin-top:14px"><h3>${ic('gauge')} Maintenance status <span class="r"><button class="btn xs" data-act="svcItemForm" data-id="${v.id}">${ic('plus')} Interval</button></span></h3>
      <div class="gauges">${items.map(i => `<div class="gauge ${i.st.level}" data-act="svcItemForm" data-id="${v.id}" data-item="${i.s.id}">${gaugeSvg(i.st.pct, i.st.level)}<div class="gv" style="color:var(--${i.st.level === 'bad' ? 'red' : i.st.level === 'warn' ? 'yellow' : 'green'})">${n0(clamp(i.st.pct, 0, 9.99) * 100)}%</div><div class="gn">${esc(i.s.name)}</div><div class="gs">${i.st.rem < 0 ? 'Overdue ' : 'left '}${esc(i.st.text)}${i.st.all?.length > 1 ? ' · ' + i.st.all.filter(a => a !== i.st.all.reduce((x, y) => y.pct > x.pct ? y : x)).map(a => (a.rem < 0 ? '−' : '') + (a.unit === 'h' ? n1(Math.abs(a.rem)) : n0(Math.abs(a.rem))) + ' ' + a.unit).join(' · ') : ''}</div></div>`).join('')}</div></div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>${ic('fleet')} ${t('specs')}</h3><div class="spec">${(v.specs || []).map(s => `<div><span>${esc(s[0])}</span><span>${esc(s[1])}</span></div>`).join('')}</div><div class="muted" style="font-size:11px;margin-top:8px">${ic('warn')} ${t('verify_manual')}</div></div>
      <div class="card"><h3>${ic('checklist')} Documents</h3>
        <div class="spec" style="grid-template-columns:1fr"><div><span>VIN</span><span>${esc(v.vin || '—')}</span></div><div><span>${t('registration')}</span><span>${esc(v.reg || '—')}</span></div><div><span>${t('registration')} ${t('expires')}</span><span>${fmtD(v.regExpiry)}</span></div><div><span>${t('insurance')} ${t('expires')}</span><span>${fmtD(v.insExpiry)}</span></div></div>
        <div class="chips" style="margin-top:10px">${expiryTag(v.regExpiry, t('registration'))}${expiryTag(v.insExpiry, t('insurance'))}</div>
        <h3 style="margin-top:14px">${ic('fuel')} ${t('nav_fuel')}</h3><div class="grid g2" style="gap:8px"><div class="stat"><div class="lbl">Avg L/100 km</div><div class="val" style="font-size:20px">${fuelAvg(v).per100 ? n1(fuelAvg(v).per100) : '—'}</div></div><div class="stat"><div class="lbl">Avg L/h</div><div class="val" style="font-size:20px">${fuelAvg(v).perH ? n1(fuelAvg(v).perH) : '—'}</div></div></div>
        ${v.notes ? `<p class="muted" style="font-size:12px;margin-top:10px">${esc(v.notes)}</p>` : ''}</div>
    </div>`;
  animateCounters($('#v-fleet'));
}
function fuelAvg(v) { const f = S.fuel.filter(x => x.vehicleId === v.id).sort((a, b) => a.date.localeCompare(b.date)); if (f.length < 2) return {}; const L = f.slice(1).reduce((a, x) => a + x.liters, 0); const km = f[f.length - 1].km - f[0].km, h = f[f.length - 1].hours - f[0].hours; return { per100: km > 0 ? L / km * 100 : 0, perH: h > 0 ? L / h : 0 }; }

function vehForm(id) {
  const v = id ? S.vehicles.find(x => x.id === id) : { name: '', type: 'enduro', brand: '', model: '', year: new Date().getFullYear(), hours: 0, km: 0, vin: '', reg: '', regExpiry: '', insExpiry: '', notes: '', specs: [] };
  if (!requirePerm(id ? 'edit' : 'add')) return;

function svcForm(vid, preItem, editId) {
  const ed = editId ? S.services.find(x => x.id === editId) : null; vid = ed ? ed.vehicleId : (vid || curVeh()?.id); const v = S.vehicles.find(x => x.id === vid); if (!v) { toast('No vehicle', true); return; }
  if (!requirePerm(ed ? 'edit' : 'add', ed?.authorId)) return;

  const draw = () => `<div class="f2"><div><label class="f">${t('vehicle')}</label><select id="sv-vid">${S.vehicles.map(x => `<option value="${x.id}" ${x.id === vid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div><div><label class="f">${t('date')}</label><input id="sv-date" type="date" value="${ed?.date || today()}"></div></div>
    <div class="f2"><div><label class="f">Hour meter (h)</label><input id="sv-h" type="number" step="0.1" value="${ed?.hours ?? v.hours}"></div><div><label class="f">Km</label><input id="sv-km" type="number" value="${ed?.km ?? v.km}"></div></div>
    <label class="f">Work done (resets the counters)</label><div style="max-height:180px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:4px 10px" id="sv-items">${v.services.map(s => { const st = svcStatus(v, s); return `<label class="chk"><input type="checkbox" value="${esc(s.name)}" ${sel.includes(s.name) ? 'checked' : ''}><span style="flex:1">${esc(s.name)}</span><span class="tag ${st.level}">${n0(clamp(st.pct, 0, 9.99) * 100)}%</span></label>`; }).join('')}</div>
    <label class="f">${t('description')} *</label><input id="sv-desc" value="${esc(ed?.desc || '')}">
    <div class="f3"><div><label class="f">Parts / materials</label><input id="sv-parts" value="${esc(ed?.parts || '')}"></div><div><label class="f">${t('cost')}</label><input id="sv-cost" type="number" value="${ed?.cost ?? ''}"></div><div><label class="f">Done by</label><input id="sv-who" value="${esc(ed?.who || me().name)}"></div></div>
    <label class="f">Photo / receipt</label><div class="chips"><label class="btn sm" style="cursor:pointer">${ic('camera')} Upload<input type="file" accept="image/*" class="hidden" id="sv-file"></label><span id="sv-photo-st" class="muted">${ed?.photo ? 'photo attached' : ''}</span></div>`;
  openModal(`${modalHead(ed ? t('edit') : t('add_service'), 'service')}${draw()}<div class="actions"><button class="btn ghost" data-act="closeModal">${t('cancel')}</button><button class="btn primary" id="sv-save">${ic('check')} ${t('save')}</button></div>`);
  let photo = ed?.photo || ''; $('#sv-file').onchange = async e => { photo = await readFileAsDataURL(e.target.files[0], 1000); $('#sv-photo-st').textContent = 'photo attached'; };
  $('#sv-vid').onchange = () => { closeModal(); svcForm($('#sv-vid').value); };
  $('#sv-save').onclick = () => {

    mutate(s => {

      if (ed) { const ov = s.vehicles.find(x => x.id === ed.vehicleId); if (ov) { ov.hours = Math.max(0, +(ov.hours - ed.hours).toFixed(1)); ov.km = Math.max(0, ov.km - ed.km); } Object.assign(s.trips.find(x => x.id === ed.id), rec); }

/* ---------- DELOVI ---------- */
function renderParts() {

  $('#v-parts').innerHTML = `<div class="vhead"><h1>${t('nav_parts')}<small>${list.length} items · ${lowParts().length} low · stock value ${money(list.reduce((a, p) => a + p.qty * p.price, 0))}</small></h1><div class="tools"><button class="btn sm primary" data-act="partForm">${ic('plus')} ${t('add')}</button></div></div>
    <div class="card"><div class="tscroll"><table><tr><th>Part</th><th>Part no.</th><th>${t('vehicle')}</th><th class="num">Qty</th><th class="num">Min</th><th class="num">Price</th><th>Status</th><th></th></tr>
    ${list.map(p => `<tr><td><b>${esc(p.name)}</b></td><td class="mono">${esc(p.partNo)}</td><td>${esc(vname(p.vehicleId))}</td><td class="num">${p.qty}</td><td class="num">${p.min}</td><td class="num">${money(p.price)}</td><td>${p.qty <= p.min ? `<span class="tag ${p.qty === 0 ? 'bad' : 'warn'}">${p.qty === 0 ? 'Out' : 'Low'}</span>` : '<span class="tag ok">OK</span>'}</td><td style="white-space:nowrap"><button class="btn xs" data-act="partQty" data-id="${p.id}" data-d="-1">−</button> <button class="btn xs" data-act="partQty" data-id="${p.id}" data-d="1">+</button> <button class="btn xs ghost" data-act="partForm" data-id="${p.id}">${ic('edit')}</button></td></tr>`).join('') || `<tr><td colspan="8" class="empty">No parts yet</td></tr>`}</table></div></div>`;

function partForm(id) {

  openModal(`${modalHead(id ? p.name : 'New part', 'parts')}<label class="f">${t('name')} *</label><input id="pt-name" value="${esc(p.name)}"><div class="f2"><div><label class="f">Part number</label><input id="pt-no" value="${esc(p.partNo)}"></div><div><label class="f">${t('vehicle')}</label><select id="pt-vid">${S.vehicles.map(x => `<option value="${x.id}" ${x.id === p.vehicleId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div>

    <div class="actions">${id ? `<button class="btn danger" id="pt-del">${ic('trash')}</button>` : ''}<button class="btn ghost" data-act="closeModal">${t('cancel')}</button><button class="btn primary" id="pt-save">${t('save')}</button></div>`);
  $('#pt-save').onclick = () => { if (!validate(['pt-name'])) return; const rec = { name: formVal('pt-name').trim(), partNo: formVal('pt-no'), vehicleId: formVal('pt-vid'), qty: num('pt-qty'), min: num('pt-min'), price: num('pt-price') }; mutate(s => { if (id) Object.assign(s.parts.find(x => x.id === id), rec); else s.parts.push({ id: uid(), ...rec }); }, (id ? 'edited part ' : 'added part ') + rec.name, { silent: true }); closeModal(); };

}

/* ---------- TROŠKOVI ---------- */
function costRows() { const rows = []; S.services.forEach(s => rows.push({ date: s.date, vehicleId: s.vehicleId, cat: 'Service', amt: s.cost || 0 })); S.fuel.forEach(f => rows.push({ date: f.date, vehicleId: f.vehicleId, cat: 'Fuel', amt: f.cost || 0 })); return rows; }
function renderCosts() {
  const rows = costRows(); const months = [...new Set(rows.map(r => monthKey(r.date)))].sort().slice(-12); const total = rows.reduce((a, r) => a + r.amt, 0);
  $('#v-costs').innerHTML = `<div class="vhead"><h1>${t('nav_costs')}<small>${money(total)} total · ${months.length} months</small></h1><div class="tools"><button class="btn sm" data-act="csvCosts">${t('export_csv')}</button></div></div>
    <div class="grid g3">${S.vehicles.map(v => { const r = rows.filter(x => x.vehicleId === v.id); const sv = r.filter(x => x.cat === 'Service').reduce((a, x) => a + x.amt, 0), fu = r.filter(x => x.cat === 'Fuel').reduce((a, x) => a + x.amt, 0); return `<div class="card stat"><div class="lbl">${esc(v.name)}</div><div class="val" style="font-size:24px" data-count="${sv + fu}">0</div><div class="sub">Service ${money(sv)} · Fuel ${money(fu)} · ${v.hours ? money((sv + fu) / v.hours) + '/h' : ''}</div></div>`; }).join('')}</div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>${t('per_month')}</h3><div style="height:260px"><canvas class="chart" id="costMonth"></canvas></div></div><div class="card"><h3>${t('per_vehicle')}</h3><div style="height:260px"><canvas class="chart" id="costVeh"></canvas></div></div></div>
    <div class="card" style="margin-top:14px"><div class="tscroll"><table><tr><th>Month</th>${S.vehicles.map(v => `<th class="num">${esc(v.name)}</th>`).join('')}<th class="num">${t('total')}</th></tr>${months.slice().reverse().map(m => `<tr><td class="mono">${m}</td>${S.vehicles.map(v => `<td class="num">${money(rows.filter(r => monthKey(r.date) === m && r.vehicleId === v.id).reduce((a, r) => a + r.amt, 0))}</td>`).join('')}<td class="num"><b>${money(rows.filter(r => monthKey(r.date) === m).reduce((a, r) => a + r.amt, 0))}</b></td></tr>`).join('')}</table></div></div>`;
  animateCounters($('#v-costs'));
  if (typeof Chart === 'undefined') return;
  const colors = ['#00e5ff', '#ffb020', '#b388ff', '#2ee6a6'];
  new Chart($('#costMonth'), { type: 'bar', data: { labels: months, datasets: S.vehicles.map((v, i) => ({ label: v.name, data: months.map(m => rows.filter(r => monthKey(r.date) === m && r.vehicleId === v.id).reduce((a, r) => a + r.amt, 0)), backgroundColor: colors[i % 4] + 'cc', borderRadius: 4 })) }, options: { ...chartOpts({ legend: true, zero: true }), scales: { x: { stacked: true, ticks: { color: '#8b98a8' } }, y: { stacked: true, ticks: { color: '#8b98a8' } } } } });
  new Chart($('#costVeh'), { type: 'doughnut', data: { labels: S.vehicles.flatMap(v => [v.name + ' – service', v.name + ' – fuel']), datasets: [{ data: S.vehicles.flatMap(v => ['Service', 'Fuel'].map(c => rows.filter(r => r.vehicleId === v.id && r.cat === c).reduce((a, r) => a + r.amt, 0))), backgroundColor: ['#00e5ff', '#00e5ff77', '#ffb020', '#ffb02077', '#b388ff', '#b388ff77'], borderColor: '#0b0f14' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8b98a8', boxWidth: 10, font: { size: 10 } } } } } });
}
function csvCosts() { download('costs.csv', '﻿' + csv([['Date', 'Vehicle', 'Category', 'Amount'], ...costRows().sort((a, b) => a.date.localeCompare(b.date)).map(r => [r.date, vname(r.vehicleId), r.cat, r.amt])]), 'text/csv'); }

/* ---------- notifikacije ---------- */
function notify(title, body) { try { if (S.settings.notif && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body, icon: faviconData() }); } catch (e) { } }
function notifyOverdueOnLoad() { const al = fleetAlerts(); if (al.bad) notify(`TrailCommand: ${al.bad} maintenance items overdue`, S.vehicles.flatMap(v => v.services.filter(s => svcStatus(v, s).level === 'bad').map(s => v.name + ': ' + s.name)).slice(0, 4).join('\n')); }
function faviconData() { return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0b0f14"/><path d="M10 44l10-22 10 15 7-10 11 17" stroke="#00e5ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="16" r="5" fill="#ffb020"/></svg>`); }
</script>
<script>
/* ================================================================== */
/*  EXTRA MODULES – checklist, planner, emergency, analytics, team,   */
/*  settings                                                          */
/* ================================================================== */

/* ---------- PRE-RIDE CHECKLIST ---------- */
const CHECK_TPL = {
  enduro: ['Engine oil level', 'Coolant level', 'Tyre pressure (0.9 bar)', 'Chain tension & lube', 'Brakes – lever and pedal', 'Clutch free play', 'Lights and switches', 'Axle nuts and wheel bolts', 'Air filter clean', 'Fuel – full tank', 'Riding gear (helmet, boots, armour)', 'Tools, tube / plug kit', 'Water and food', 'Phone charged + GPS'],
  utv: ['Engine oil level', 'Coolant level', 'Tyre pressure (14 psi)', 'CVT belt – visual check', 'Brakes', 'Steering play', 'Lights and horn', 'Seat belts', 'Wheel nuts', 'Winch / tow strap working', 'Fuel – full tank + spare', 'First aid kit and fire extinguisher', 'Radio / phone', 'Documents / permits'],
};
let checkVid = null;
function renderChecklist() {
  const v = S.vehicles.find(x => x.id === checkVid) || S.vehicles[0]; if (!v) { $('#v-checklist').innerHTML = '<div class="empty">Add a vehicle first.</div>'; return; } checkVid = v.id;
  const hist = S.checklists.filter(c => c.vehicleId === v.id).sort((a, b) => b.date.localeCompare(a.date));
  const tpl = CHECK_TPL[v.type] || CHECK_TPL.enduro;
  $('#v-checklist').innerHTML = `<div class="vhead"><h1>${t('nav_checklist')}<small>Quick inspection before every ride · ${esc(v.name)}</small></h1></div>
    <div class="vsel">${S.vehicles.map(x => `<button class="${x.id === v.id ? 'active' : ''}" data-act="selCheckVeh" data-id="${x.id}">${ic(x.type === 'utv' ? 'buggy' : 'moto')}${esc(x.name)}</button>`).join('')}</div>
    <div class="grid g2"><div class="card"><h3>${ic('checklist')} Checklist <span class="r"><span class="tag info" id="ckProg">0/${tpl.length}</span></span></h3><div id="ckItems">${tpl.map((it, i) => `<label class="chk"><input type="checkbox" data-i="${i}"><span>${esc(it)}</span></label>`).join('')}</div>
      <label class="f">Signature (draw with your finger)</label><canvas class="sig" id="sigPad"></canvas><div class="chips" style="margin-top:6px"><button class="btn xs ghost" id="sigClear">Clear signature</button><span class="muted" style="font-size:11px">${me().name} · ${fmtD(today())}</span></div>
      <label class="f">${t('notes')}</label><input id="ckNotes"><button class="btn primary full" id="ckSave" style="margin-top:12px">${ic('check')} Confirm and save</button></div>
    <div class="card"><h3>History (${hist.length})</h3>${hist.slice(0, 15).map(c => `<div class="li"><span class="tag ${c.items.every(i => i.ok) ? 'ok' : 'warn'}">${c.items.filter(i => i.ok).length}/${c.items.length}</span><div class="t"><b>${fmtD(c.date)} – ${esc(c.user)}</b><small>${esc(c.notes) || (c.items.filter(i => !i.ok).map(i => i.t).join(', ') || 'all OK')}</small></div>${c.sig ? `<img src="${c.sig}" style="height:30px;background:#fff;border-radius:4px">` : ''}</div>`).join('') || '<div class="empty">No saved checklists yet</div>'}</div></div>`;
  const prog = () => $('#ckProg').textContent = $$('#ckItems input:checked').length + '/' + tpl.length; $('#ckItems').onchange = prog;
  const cv = $('#sigPad'); cv.width = cv.offsetWidth * 2; cv.height = 240; const ctx = cv.getContext('2d'); ctx.strokeStyle = '#ff6a1f'; ctx.lineWidth = 3; ctx.lineCap = 'round'; let drawing = false, signed = false;
  const pos = e => { const r = cv.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return [(p.clientX - r.left) * 2, (p.clientY - r.top) * 2]; };
  const st = e => { drawing = true; signed = true; ctx.beginPath(); ctx.moveTo(...pos(e)); e.preventDefault(); }; const mv = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); e.preventDefault(); }; const en = () => drawing = false;
  cv.onmousedown = st; cv.onmousemove = mv; cv.onmouseup = en; cv.onmouseleave = en; cv.ontouchstart = st; cv.ontouchmove = mv; cv.ontouchend = en;
  $('#sigClear').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); signed = false; };
  $('#ckSave').onclick = () => { const items = tpl.map((tt, i) => ({ t: tt, ok: $(`#ckItems input[data-i="${i}"]`).checked })); if (!signed) { toast('Please sign the checklist', true); return; } mutate(s => s.checklists.push({ id: uid(), vehicleId: v.id, date: today(), user: me().name, items, notes: formVal('ckNotes'), sig: cv.toDataURL('image/png') }), `completed the pre-ride checklist for ${v.name} (${items.filter(i => i.ok).length}/${items.length})`); };
}

/* ---------- RIDE PLANNER ---------- */
function renderPlanner() {
  const list = S.events.slice().sort((a, b) => a.date.localeCompare(b.date)); const up = list.filter(e => e.date >= today()), past = list.filter(e => e.date < today());
  const card = e => { const r = S.routes.find(x => x.id === e.routeId); const joined = e.participants.includes(me().name); return `<div class="card ${e.date < today() ? '' : daysBetween(today(), e.date) <= 7 ? 'amber' : ''}"><h3>${ic('planner')} ${esc(e.title)} <span class="r"><span class="tag ${e.date < today() ? 'dim' : 'info'}">${fmtD(e.date)} · ${e.date >= today() ? 'in ' + daysBetween(today(), e.date) + ' days' : 'past'}</span></span></h3>
      <div class="chips" style="margin-bottom:8px">${e.poiId ? `<button class="chip" data-act="focusPoi" data-id="${e.poiId}">${ic('pin', '')} ${esc(pname(e.poiId))}</button>` : ''}${r ? `<span class="chip">${esc(r.name)} · ${U.dist(pathLength(r.points))}</span>` : ''}<span class="chip">${esc(e.author || '')}</span></div>
      ${e.notes ? `<p class="muted" style="font-size:12px;margin:0 0 8px">${esc(e.notes)}</p>` : ''}
      <div class="grid g2" style="gap:10px"><div><h3 style="font-size:11px">Riders (${e.participants.length})</h3><div class="online">${e.participants.map(p => `<span><i></i>${esc(p)}</span>`).join('') || '<span class="muted">—</span>'}</div></div>
      <div><h3 style="font-size:11px">Gear</h3>${e.gear.map((g, i) => `<label class="chk" style="padding:3px 0;font-size:12px;${g.ok ? 'color:var(--muted)' : ''}"><input type="checkbox" ${g.ok ? 'checked' : ''} data-act="gearToggle" data-id="${e.id}" data-i="${i}"> ${esc(g.t)}</label>`).join('')}</div></div>
      <div class="actions" style="margin-top:10px">${e.date >= today() ? `<button class="btn sm ${joined ? 'amber' : 'primary'}" data-act="joinEvent" data-id="${e.id}">${joined ? 'Leave' : ic('check') + ' Join'}</button>` : ''}${can('edit', e.authorId) ? `<button class="btn sm" data-act="eventForm" data-id="${e.id}">${ic('edit')}</button>` : ''}</div></div>`; };
  $('#v-planner').innerHTML = `<div class="vhead"><h1>${t('nav_planner')}<small>${up.length} upcoming rides</small></h1><div class="tools"><button class="btn sm primary" data-act="eventForm">${ic('plus')} New ride</button></div></div>
    <div class="grid g2">${up.map(card).join('') || '<div class="empty">No rides planned yet. Create one and invite your crew.</div>'}</div>${past.length ? `<h3 style="margin:18px 0 10px">Past rides</h3><div class="grid g2">${past.slice(-4).reverse().map(card).join('')}</div>` : ''}`;
}
function eventForm(id) {
  const e = id ? S.events.find(x => x.id === id) : { title: '', date: today(), routeId: '', poiId: '', participants: [me().name], gear: [{ t: 'Spare fuel', ok: false }, { t: 'First aid kit', ok: false }, { t: 'Tools', ok: false }], notes: '' }; if (!requirePerm(id ? 'edit' : 'add', e.authorId)) return;
  openModal(`${modalHead(id ? e.title : 'New ride', 'planner')}<label class="f">Title *</label><input id="ev-title" value="${esc(e.title)}"><div class="f2"><div><label class="f">${t('date')}</label><input id="ev-date" type="date" value="${e.date}"></div><div><label class="f">Map point</label><select id="ev-poi"><option value="">—</option>${S.pois.map(p => `<option value="${p.id}" ${e.poiId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>
    <label class="f">${t('route')}</label><select id="ev-route"><option value="">—</option>${S.routes.map(r => `<option value="${r.id}" ${e.routeId === r.id ? 'selected' : ''}>${esc(r.name)} (${U.dist(pathLength(r.points))})</option>`).join('')}</select>
    <label class="f">Riders (comma separated)</label><input id="ev-part" value="${esc(e.participants.join(', '))}"><label class="f">Gear list (one per line)</label><textarea id="ev-gear">${esc(e.gear.map(g => g.t).join('\n'))}</textarea><label class="f">${t('notes')}</label><textarea id="ev-notes">${esc(e.notes)}</textarea>
    <div class="actions">${id ? `<button class="btn danger" id="ev-del">${ic('trash')}</button>` : ''}<button class="btn ghost" data-act="closeModal">${t('cancel')}</button><button class="btn primary" id="ev-save">${t('save')}</button></div>`);
  $('#ev-save').onclick = () => { if (!validate(['ev-title'])) return; const gearT = formVal('ev-gear').split('\n').map(x => x.trim()).filter(Boolean); const rec = { title: formVal('ev-title').trim(), date: formVal('ev-date'), poiId: formVal('ev-poi'), routeId: formVal('ev-route'), participants: formVal('ev-part').split(',').map(x => x.trim()).filter(Boolean), gear: gearT.map(tt => ({ t: tt, ok: e.gear.find(g => g.t === tt)?.ok || false })), notes: formVal('ev-notes') }; mutate(s => { if (id) Object.assign(s.events.find(x => x.id === id), rec); else s.events.push({ id: uid(), author: me().name, authorId: me().id, ...rec }); }, (id ? 'edited ride "' : 'planned ride "') + rec.title + '"'); closeModal(); };
  if (id) $('#ev-del').onclick = () => confirmBox(t('confirm_delete'), () => { mutate(s => s.events = s.events.filter(x => x.id !== id), 'deleted a ride'); closeModal(); });
}

/* ---------- EMERGENCY ---------- */
let sosPos = null;

function renderAnalytics() {
  const months = []; for (let i = 11; i >= 0; i--) { const d = new Date(); d.setMonth(d.getMonth() - i); months.push(d.toISOString().slice(0, 7)); }
  const byPoi = {}; S.trips.forEach(tr => { if (tr.poiId) { byPoi[tr.poiId] = byPoi[tr.poiId] || { n: 0, h: 0 }; byPoi[tr.poiId].n++; byPoi[tr.poiId].h += tr.hours; } });
  const topPoi = Object.entries(byPoi).sort((a, b) => b[1].n - a[1].n).slice(0, 6);
  const condCount = {}; S.trips.forEach(tr => (tr.conditions || []).forEach(c => condCount[c] = (condCount[c] || 0) + 1));
  $('#v-analytics').innerHTML = `<div class="vhead"><h1>${t('nav_analytics')}<small>Last 12 months · ${S.trips.length} trips</small></h1></div>
    <div class="grid g2"><div class="card"><h3>Hours per month</h3><div style="height:240px"><canvas class="chart" id="anHours"></canvas></div></div><div class="card"><h3>Costs per vehicle (12 months)</h3><div style="height:240px"><canvas class="chart" id="anCost"></canvas></div></div>
    <div class="card"><h3>Most ridden spots</h3>${topPoi.map(([id, x]) => `<div class="li" data-act="focusPoi" data-id="${id}" style="cursor:pointer"><div class="t"><b>${esc(pname(id))}</b><small>${x.n} trips · ${n1(x.h)} h</small></div><div class="bar" style="width:40%"><i style="width:${x.n / topPoi[0][1].n * 100}%"></i></div></div>`).join('') || '<div class="empty">Log trips with a location to see your favourite spots.</div>'}</div>
    <div class="card"><h3>Vehicle comparison</h3><div class="tscroll"><table><tr><th></th>${S.vehicles.map(v => `<th class="num">${esc(v.name)}</th>`).join('')}</tr>
      ${[['Total hours', v => n1(v.hours)], ['Total km', v => n0(v.km)], ['Trips (12 mo)', v => S.trips.filter(x => x.vehicleId === v.id && months.includes(monthKey(x.date))).length], ['Hours (12 mo)', v => n1(S.trips.filter(x => x.vehicleId === v.id && months.includes(monthKey(x.date))).reduce((a, x) => a + x.hours, 0))], ['Avg hours / trip', v => { const tr = S.trips.filter(x => x.vehicleId === v.id); return tr.length ? n1(tr.reduce((a, x) => a + x.hours, 0) / tr.length) : '—'; }], ['Cost / hour', v => v.hours ? money(costRows().filter(r => r.vehicleId === v.id).reduce((a, r) => a + r.amt, 0) / v.hours) : '—'], ['Fuel L/h', v => fuelAvg(v).perH ? n1(fuelAvg(v).perH) : '—'], ['Overdue items', v => v.services.filter(s => svcStatus(v, s).level === 'bad').length]].map(([l, f]) => `<tr><td>${l}</td>${S.vehicles.map(v => `<td class="num">${f(v)}</td>`).join('')}</tr>`).join('')}</table></div>
      <h3 style="margin-top:12px">Terrain conditions</h3><div class="chips">${Object.entries(condCount).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<span class="tag dim">${t('cond_' + c)} × ${n}</span>`).join('') || '<span class="muted">—</span>'}</div></div></div>`;
  if (typeof Chart === 'undefined') return; const colors = ['#ff6a1f', '#60a5fa', '#a78bfa', '#34d399'];
  new Chart($('#anHours'), { type: 'line', data: { labels: months.map(m => m.slice(2)), datasets: S.vehicles.map((v, i) => ({ label: v.name, data: months.map(m => S.trips.filter(x => x.vehicleId === v.id && monthKey(x.date) === m).reduce((a, x) => a + x.hours, 0)), borderColor: colors[i % 4], backgroundColor: colors[i % 4] + '22', fill: true, tension: .35, pointRadius: 3 })) }, options: chartOpts({ legend: true, zero: true, y: 'h' }) });
  new Chart($('#anCost'), { type: 'bar', data: { labels: S.vehicles.map(v => v.name), datasets: ['Service', 'Fuel'].map((c, i) => ({ label: c, data: S.vehicles.map(v => costRows().filter(r => r.vehicleId === v.id && r.cat === c && months.includes(monthKey(r.date))).reduce((a, r) => a + r.amt, 0)), backgroundColor: [colors[0] + 'cc', colors[1] + 'cc'][i], borderRadius: 4 })) }, options: chartOpts({ legend: true, zero: true }) });
}

function applyTheme() { document.documentElement.dataset.theme = S.settings.theme; $('meta[name=theme-color]').content = S.settings.theme === 'dark' ? '#0f1115' : '#f4f5f7'; }
async function cacheTiles() {
  if (!map) { toast('Open the map first', true); return; } if (!navigator.serviceWorker?.controller) { toast('Offline mode is not active (needs sw.js on an HTTPS host)', true); return; }
  const b = map.getBounds(), z0 = Math.max(10, map.getZoom()), urls = []; const tpl = S.settings.mapLayer === 'sat' ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}' : S.settings.mapLayer === 'topo' ? 'https://a.tile.opentopomap.org/{z}/{x}/{y}.png' : 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png';
  const t2 = (lat, lng, z) => [Math.floor((lng + 180) / 360 * 2 ** z), Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * 2 ** z)];
  for (let z = z0; z <= Math.min(z0 + 3, 16); z++) { const [x1, y1] = t2(b.getNorth(), b.getWest(), z), [x2, y2] = t2(b.getSouth(), b.getEast(), z); for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) urls.push(tpl.replace('{z}', z).replace('{x}', x).replace('{y}', y)); if (urls.length > 600) break; }
  toast(`Downloading ${urls.length} map tiles…`); let ok = 0; for (const u of urls.slice(0, 600)) { try { await fetch(u, { mode: 'no-cors' }); ok++; } catch (e) { } } toast(`${ok} tiles cached for offline use`);
}
