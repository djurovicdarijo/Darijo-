<script>
/* ================================================================== */
/*  CLOUD – Firebase (Firestore + Auth), optional                    */
/*  ------------------------------------------------------------------
    HOW TO CREATE A FREE FIREBASE PROJECT:
    1. https://console.firebase.google.com → "Add project" (Spark plan is free)
    2. Build → Firestore Database → Create database (production mode, region europe-west)
    3. Build → Authentication → Get started → Sign-in method: Google + Email/Password
    4. Project settings (gear) → Your apps → Web (</>) → Register app → copy firebaseConfig
    5. Enter the values in Settings → Firebase configuration (or put them in FIREBASE_CONFIG below)
    6. Firestore → Rules:
         rules_version = '2';
         service cloud.firestore {
           match /databases/{database}/documents {
             match /{document=**} { allow read, write: if request.auth != null; }
           }
         }
    7. Authentication → Settings → Authorized domains → add your hosting domain (e.g. user.github.io)
    Roles: a signed-in user whose email matches a member in "Team" gets that role;
    unknown email = Member. Admins change roles in the Team module.
   ------------------------------------------------------------------ */
const FIREBASE_CONFIG = null; /* or: { apiKey:"...", authDomain:"...", projectId:"...", storageBucket:"...", messagingSenderId:"...", appId:"..." } */
const SYNC_COLLECTIONS = ['users', 'vehicles', 'pois', 'routes', 'services', 'trips', 'fuel', 'parts', 'checklists', 'events', 'activity', 'contacts'];
let cloudLastPushed = {}; let presenceTimer = null; let applyingRemote = false;

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function initCloud() {
  const cfg = S.settings.firebase || FIREBASE_CONFIG; if (!cfg || !cfg.apiKey) return;
  try {
    if (!window.firebase) { const v = '10.12.2'; await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`); await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`); await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`); }
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    cloud.db = firebase.firestore(); cloud.auth = firebase.auth(); cloud.enabled = true;
    try { await cloud.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { }
    cloud.auth.onAuthStateChanged(u => { cloud.user = u; if (u) { mapAuthUser(u); cloudSubscribe(); startPresence(); toast('Signed in: ' + (u.displayName || u.email)); } else { cloudUnsubscribe(); } renderAll(); });
    renderAll(); toast('Firebase connected – please sign in');
  } catch (e) { console.error(e); cloud.enabled = false; toast('Firebase error: ' + e.message, true); }
}
function cloudStop() { cloudUnsubscribe(); cloud.enabled = false; cloud.user = null; }
function mapAuthUser(u) {
  let local = S.users.find(x => x.email && u.email && x.email.toLowerCase() === u.email.toLowerCase());
  if (!local) { local = { id: 'fb-' + u.uid, name: u.displayName || u.email.split('@')[0], role: S.users.length ? 'member' : 'admin', email: u.email || '' }; S.users.push(local); }
  S.settings.currentUser = local.id; persist();
}
async function fbLogin(kind, email, pass) {
  try {
    if (kind === 'google') await cloud.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    else if (kind === 'email') await cloud.auth.signInWithEmailAndPassword(email, pass);
    else await cloud.auth.createUserWithEmailAndPassword(email, pass);
    closeModal();
  } catch (e) { toast(e.message, true); }
}
/* Firestore model: kolekcija po tipu, dokument po stavci (id = item.id) */
function cloudSubscribe() {
  cloudUnsubscribe();
  SYNC_COLLECTIONS.forEach(col => {
    const unsub = cloud.db.collection('tc_' + col).onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      const remote = snap.docs.map(d => d.data()); if (!snap.size && S[col].length) { cloudPushCollection(col); return; } /* prazna baza → inicijalno popuni */
      applyingRemote = true; S[col] = col === 'activity' ? remote.sort((a, b) => b.date.localeCompare(a.date)).slice(0, 200) : remote; cloudLastPushed[col] = JSON.stringify(S[col]); persist(); applyingRemote = false; renderAll();
    }, err => toast('Sync error: ' + err.message, true));
    cloud.unsub.push(unsub);
  });
  const pu = cloud.db.collection('tc_presence').onSnapshot(snap => { const now = Date.now(); cloud.presence = snap.docs.map(d => d.data()).filter(p => now - p.lastSeen < 120000).map(p => p.name); if (S.settings.view === 'team') renderTeam(); });
  cloud.unsub.push(pu);
}
function cloudUnsubscribe() { cloud.unsub.forEach(u => u()); cloud.unsub = []; clearInterval(presenceTimer); }
function cloudPush() { if (!cloud.enabled || !cloud.user || applyingRemote) return; SYNC_COLLECTIONS.forEach(col => { if (JSON.stringify(S[col]) !== cloudLastPushed[col]) cloudPushCollection(col); }); }
async function cloudPushCollection(col) {
  try {
    const ref = cloud.db.collection('tc_' + col); const prev = cloudLastPushed[col] ? JSON.parse(cloudLastPushed[col]) : []; const batch = cloud.db.batch();
    const keyOf = (x, i) => x.id || (col === 'contacts' ? 'c-' + i : 'x-' + i);
    S[col].forEach((item, i) => { const k = keyOf(item, i); const p = prev.find((y, j) => keyOf(y, j) === k); if (!p || JSON.stringify(p) !== JSON.stringify(item)) batch.set(ref.doc(k), JSON.parse(JSON.stringify({ ...item, id: k }))); });
    prev.forEach((item, i) => { const k = keyOf(item, i); if (!S[col].some((y, j) => keyOf(y, j) === k)) batch.delete(ref.doc(k)); });
    await batch.commit(); cloudLastPushed[col] = JSON.stringify(S[col]);
  } catch (e) { toast('Cloud write failed: ' + e.message, true); }
}
function startPresence() { const beat = () => cloud.db.collection('tc_presence').doc(cloud.user.uid).set({ name: me().name, lastSeen: Date.now() }).catch(() => { }); beat(); clearInterval(presenceTimer); presenceTimer = setInterval(beat, 30000); }
function syncNow() { const b = $('#syncBtn'); b.classList.add('spin'); if (cloud.enabled && cloud.user) { cloudLastPushed = {}; cloudPush(); toast('Syncing…'); } else toast(cloud.enabled ? 'Sign in to sync' : 'Local mode – nothing to sync'); setTimeout(() => b.classList.remove('spin'), 1200); }

/* ================================================================== */
/*  PWA – manifest (data URI) + service worker (sw.js pored fajla)     */
/* ================================================================== */
function setupPWA() {
  const manifest = { name: 'TrailCommand – Off-Road Operations', short_name: 'TrailCommand', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#0b0f14', theme_color: '#0b0f14', icons: [{ src: faviconData(), sizes: '192x192 512x512', type: 'image/svg+xml', purpose: 'any' }] };
  $('#manifestLink').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = faviconData(); document.head.appendChild(fav);
  const ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; ati.href = faviconData(); document.head.appendChild(ati);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').then(() => console.log('SW ok')).catch(() => console.log('sw.js not found – offline caching disabled'));
}

/* ================================================================== */
/*  INIT – događaji (delegacija preko data-act), prečice, start       */
/* ================================================================== */
const ACTIONS = {
  go: d => go(d.v), goView: d => { closeModal(); go(d.id); }, goFleet: d => { fleetVid = d.id; closeModal(); go('fleet'); }, selVeh: d => { fleetVid = d.id; renderFleet(); }, selCheckVeh: d => { checkVid = d.id; renderChecklist(); },
  closeModal: () => closeModal(), undo: () => undo(), search: () => openSearch(), sync: () => syncNow(), openUser: () => openUser(), userForm: d => userForm(d.id),
  layer: d => setLayer(d.v), toggleHeat: () => toggleHeat(), drawRoute: () => mode === 'draw' ? cancelDraw() : startDraw(), finishDraw: () => finishDraw(), cancelDraw: () => cancelDraw(), measure: () => startMeasure(), locate: () => locate(),
  addPoiCoords: () => openPoiForm(null, map ? map.getCenter() : { lat: 44.0, lng: 20.9 }), poiHere: () => myPos && openPoiForm(null, { lat: myPos[0], lng: myPos[1] }), focusPoi: d => focusPoi(d.id), poiDetail: d => poiDetail(d.id), editPoi: d => openPoiForm(d.id),
  delPoi: d => confirmBox(t('confirm_delete'), () => { const p = S.pois.find(x => x.id === d.id); if (!requirePerm('delete', p.authorId)) return; mutate(s => { s.pois = s.pois.filter(x => x.id !== d.id); s.trips.forEach(tr => { if (tr.poiId === d.id) tr.poiId = ''; }); }, `deleted point "${p.name}"`); closeModal(); }),
  rate: d => ratePoi(d.id, +d.v), comment: d => commentPoi(d.id), weather: d => loadWeather(d.id), navigate: d => navigateTo(d.lat, d.lng), tripFromPoi: d => tripForm(null, null, d.id),
  elevation: d => showElevation(d.id), exportRoute: d => { const r = S.routes.find(x => x.id === d.id); download(r.name.replace(/\W+/g, '_') + '.gpx', gpxString([r], []), 'application/gpx+xml'); }, routeStart: d => { const r = S.routes.find(x => x.id === d.id); navigateTo(r.points[0][0], r.points[0][1]); }, delRoute: d => delRoute(d.id),
  exportGpx: () => download('trailcommand.gpx', gpxString(S.routes, S.pois), 'application/gpx+xml'), exportKml: () => download('trailcommand.kml', kmlString(S.routes, S.pois), 'application/vnd.google-earth.kml+xml'),
  vehForm: d => vehForm(d.id), delVeh: d => delVeh(d.id), svcItemForm: d => svcItemForm(d.id, d.item), svcForm: d => svcForm(d.id, d.item, d.edit), svcDetail: d => svcDetail(d.id), printService: () => printService(), csvService: () => csvService(),
  tripForm: d => tripForm(d.id, d.edit), csvTrips: () => csvTrips(), fuelForm: d => fuelForm(d.edit), partForm: d => partForm(d.id), partQty: d => mutate(s => { const p = s.parts.find(x => x.id === d.id); p.qty = Math.max(0, p.qty + (+d.d)); }, null), csvCosts: () => csvCosts(),
  eventForm: d => eventForm(d.id), joinEvent: d => mutate(s => { const e = s.events.find(x => x.id === d.id); const n = me().name; e.participants = e.participants.includes(n) ? e.participants.filter(x => x !== n) : [...e.participants, n]; }, `updated attendance for "${S.events.find(x => x.id === d.id).title}"`, { silent: true }),
  gearToggle: d => mutate(s => { const g = s.events.find(x => x.id === d.id).gear[+d.i]; g.ok = !g.ok; }, null),
  sosLocate: () => locate(p => { sosPos = p; renderSOS(); }), contactForm: () => contactForm(), delContact: d => mutate(s => s.contacts.splice(+d.i, 1), 'removed a contact'),
  copy: d => { navigator.clipboard?.writeText(d.v).then(() => toast('Copied: ' + d.v)).catch(() => toast('Clipboard not available', true)); },
  exportJson: () => download(`trailcommand-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'),
  resetDemo: () => confirmBox('Reset to the starting data? Current data will be deleted.', () => { undoStack.push(JSON.stringify(S)); const st = S.settings; S = emptyState(); S.settings = { ...st }; seedDemo(); S.settings = { ...S.settings, ...st, currentUser: S.settings.currentUser }; persist(); renderAll(); }),
  resetAll: () => confirmBox(t('reset') + '?', () => { undoStack.push(JSON.stringify(S)); S = emptyState(); S.users = [{ id: 'u-owner', name: 'Owner', role: 'admin', email: '' }]; S.settings.currentUser = 'u-owner'; persist(); renderAll(); }),
  cacheTiles: () => cacheTiles(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { /* gearToggle preko change */ return; }
  const act = ACTIONS[el.dataset.act]; if (act) { e.preventDefault(); act(el.dataset, el); }
});
document.addEventListener('change', e => { const el = e.target.closest('input[type=checkbox][data-act]'); if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el.dataset, el); });
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); } if (e.key === 'Escape') closeModal(); if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); undo(); } });
window.addEventListener('online', renderTopbar); window.addEventListener('offline', renderTopbar);
window.addEventListener('resize', () => map && map.invalidateSize());

/* START */
load(); applyTheme(); setupPWA(); renderAll(); tickClock(); setInterval(tickClock, 1000);
$('#undoBtn').style.opacity = .4;
if (!S.settings.view || !$('#v-' + S.settings.view)) S.settings.view = 'dashboard';
go(S.settings.view);
setTimeout(notifyOverdueOnLoad, 1500);
initCloud();
</script>
